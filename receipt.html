<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Receipt (A4 - Multiple Receipts Per Page)</title>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <style>
    /* ======================================================== */
    /* UBAH SAIZ FONT DI SINI (UNTUK SEMUA BARIS) */
    /* ======================================================== */
    :root {
      --body-font-size: 8.8pt;
      --body-font-size-print: 8.8pt;
      
      --header-main-size: 2rem;
      --header-main-size-print: 20pt;
      
      --header-branch-size: 2rem;
      --header-branch-size-print: 20pt;
      
      --barcode-text-size: 0.9rem;
      --barcode-text-size-print: 7.5pt;
      
      /* ======================================================== */
      /* MAX WIDTH SETIAP KUMPULAN BARIS */
      /* ======================================================== */
      --max-width-header-trx: 6.5cm;
      --max-width-item-number: 6.0cm;
      --max-width-membership-pmy: 6.5cm;
      --max-width-barcode-last: 6.5cm;
      
      /* ======================================================== */
      /* PRINT MARGIN */
      /* ======================================================== */
      --print-margin: 10mm;
    }
    /* ======================================================== */
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Consolas', 'Lucida Console', 'Courier New', monospace; 
    }
    body {
      background: #f3f4f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      width: 100%;
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 35px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #1e293b;
      text-align: center;
      margin-bottom: 25px;
      border-bottom: 2px dashed #cbd5e1;
      padding-bottom: 15px;
      font-family: sans-serif;
    }
    .receipt-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
    }
    
    /* === BORANG KIRI === */
    .form-panel {
      flex: 1;
      min-width: 350px;
      background: #f8fafc;
      border-radius: 18px;
      padding: 20px;
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
    }
    .form-panel h2 {
      font-size: 1.1rem;
      margin-bottom: 10px;
      color: #0f172a;
      font-family: sans-serif;
    }
    
    .cashier-settings {
      background: #e2e8f0;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
    }
    .cashier-settings label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: #334155;
      margin-bottom: 4px;
      font-family: sans-serif;
    }
    .cashier-settings input {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-family: 'Consolas', 'Lucida Console', monospace;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }
    .cashier-settings input:last-child { margin-bottom: 0; }

    /* === MARGIN SETTINGS === */
    .margin-settings {
      background: #e2e8f0;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
    }
    .margin-settings label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: #334155;
      margin-bottom: 4px;
      font-family: sans-serif;
    }
    .margin-settings .value-display {
      display: inline-block;
      background: #cbd5e1;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      margin-left: 8px;
      font-weight: 600;
    }
    .margin-settings input[type="range"] {
      width: 100%;
    }
    .margin-settings .hint {
      font-size: 0.7rem;
      color: #64748b;
      margin-top: 3px;
      font-family: sans-serif;
    }

    .log-textarea {
      width: 100%;
      flex: 1;
      min-height: 400px;
      padding: 15px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-family: 'Consolas', 'Lucida Console', monospace;
      font-size: 0.85rem;
      background: #0f172a;
      color: #38bdf8;
      resize: vertical;
      line-height: 1.4;
      margin-bottom: 15px;
    }
    .log-textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
    }
    
    .print-warning {
      background: #fffbeb;
      border: 1px solid #fcd34d;
      color: #b45309;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: sans-serif;
    }

    .btn-generate {
      width: 100%;
      background: #10b981;
      color: white;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: sans-serif;
    }
    .btn-generate:hover {
      background: #059669;
      transform: translateY(-2px);
    }
    
    /* === PREVIEW KANAN (RESIT) === */
    .preview-panel {
      flex: 1.5;
      min-width: 350px;
      background: white;
      border-radius: 12px;
      padding: 15px;
      border: 2px dashed #cbd5e1;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: auto; 
      max-height: 85vh;
    }
    .preview-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 10px;
      font-weight: 600;
      text-align: center;
      font-family: sans-serif;
    }
    
    /* === A4 PAGE CONTAINER === */
    .a4-page-container {
      background: #fff;
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto;
      padding: 10mm;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      display: flex;
      flex-wrap: wrap;
      gap: 5mm;
      align-content: flex-start;
    }
    
    /* === RECEIPT ITEM (3 INCI) === */
    .receipt-preview-item {
      background: #fff;
      padding: 10px 5px;
      font-family: 'Consolas', 'Lucida Console', 'Courier New', monospace;
      font-weight: 600; 
      font-size: var(--body-font-size);
      line-height: 1.05;
      color: #000;
      width: 3in;
      min-width: 3in;
      max-width: 3in;
      border: 1px dashed #94a3b8;
      padding-bottom: 10px;
      text-align: left;
      page-break-inside: avoid;
    }
    
    /* Gaya resit Parkson */
    .r-center { text-align: center !important; }
    .r-left { text-align: left !important; }
    .r-justify { text-align: justify !important; }
    .r-bold { font-weight: 900; } 
    .r-normal { font-weight: 400; text-align: left; }
    .r-dash { border-top: 1px dashed #000; margin: 3px 0; }
    
    .r-item-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 5px;
      width: 100%;
    }
    .r-item-name { flex: 1; text-align: left; }
    .r-item-price { white-space: nowrap; text-align: right; }
    
    .r-nowrap {
      white-space: nowrap !important;
      display: block;
      width: 100%;
      text-align: left;
    }
    
    /* ======================================================== */
    /* MAX WIDTH KHAS UNTUK SETIAP KUMPULAN */
    /* ======================================================== */
    .r-section-header-trx {
      max-width: var(--max-width-header-trx);
      width: 100%;
      margin: 0;
    }
    .r-section-item-number {
      max-width: var(--max-width-item-number);
      width: 100%;
      margin: 0;
    }
    .r-section-membership-pmy {
      max-width: var(--max-width-membership-pmy);
      width: 100%;
      margin: 0;
    }
    .r-section-barcode-last {
      max-width: var(--max-width-barcode-last);
      width: 100%;
      margin: 0;
    }
    
    /* HEADER: CENTER */
    .r-header-main { font-size: var(--header-main-size); font-weight: 900; letter-spacing: 1px; line-height: 1; margin-top: 0; margin-bottom: 0; text-align: center; }
    .r-header-branch { font-size: var(--header-branch-size); font-weight: 900; letter-spacing: 1px; margin-bottom: 2px; margin-top: 0; text-align: center; }

    /* Barcode Real - LEFT */
    .barcode-container {
      text-align: left;
      margin-top: 0px;
      margin-bottom: 0;
      line-height: 0;
    }
    .barcode-container svg {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0;
    }

    /* Teks Bawah Barcode - CENTER */
    .barcode-text {
      text-align: center;
      font-size: var(--barcode-text-size);
      letter-spacing: 3px; 
      font-weight: 400 !important; 
      margin-top: 0; 
      padding-top: 0;
      white-space: nowrap;
      display: block;
      width: 100%; 
      line-height: 1; 
    }

    /* WWW - CENTER */
    .r-www {
      text-align: center;
      width: 100%;
      letter-spacing: normal;
    }

    /* MEMBERSHIP NUMBER - LEFT */
    .r-membership-justify {
      display: flex;
      align-items: flex-start;
      gap: 0px;
      width: 100%;
      font-size: var(--body-font-size);
      font-weight: 600;
      white-space: nowrap;
      letter-spacing: -1px;
      text-align: left;
    }

    /* TARIKH - LEFT, COMPRESSED */
    .r-date-left {
      font-size: 8pt;
      font-weight: 400;
      letter-spacing: -0.3px;
      text-align: left;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
    }

    /* TRX# - LEFT */
    .r-trx-normal {
      font-size: var(--body-font-size);
      font-weight: 900;
      letter-spacing: normal;
      width: 100%;
      text-align: left;
    }

    /* VISA/MASTER CARD NO - LEFT */
    .r-card-normal {
      font-size: var(--body-font-size);
      font-weight: 900;
      letter-spacing: normal;
      width: 100%;
      text-align: left;
    }

    /* ======================================================== */
    /* SEMUA HARGA DI KANAN (SEJAJAR DENGAN HARGA ITEM) */
    /* ======================================================== */
    .r-price-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 5px;
      width: 100%;
      font-weight: 900;
    }
    .r-price-row .r-label { text-align: left; flex: 1; }
    .r-price-row .r-value { text-align: right; white-space: nowrap; }

    /* === PRINT STYLES === */
    @media print {
      @page { 
        size: A4; 
        margin: var(--print-margin);
      }
      
      html, body { 
        background: white !important; 
        padding: 0 !important; 
        margin: 0 !important;
        width: 100% !important;
        -webkit-print-color-adjust: exact; 
        print-color-adjust: exact;
      }
      
      .container, .receipt-wrapper, .preview-panel { 
        box-shadow: none !important; 
        padding: 0 !important; 
        margin: 0 !important;
        max-width: 100% !important; 
        width: 100% !important;
        border: none !important;
        overflow: visible !important;
      }

      h1, .form-panel, .preview-label, .print-warning, .margin-settings { 
        display: none !important; 
      }
      
      .a4-page-container {
        width: 100% !important;
        min-height: auto !important;
        padding: 0 !important;
        margin: 0 !important;
        box-shadow: none !important;
        gap: 5mm;
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
      }
      
      .receipt-preview-item { 
        width: 3in !important;
        min-width: 3in !important;
        max-width: 3in !important;
        font-size: var(--body-font-size-print) !important;
        font-weight: 600 !important; 
        padding: 0.01in 0.05in !important; 
        margin: 0 !important; 
        line-height: 1.05 !important; 
        box-shadow: none !important;
        border: none !important;
        letter-spacing: -1.2px; 
        page-break-inside: avoid;
        text-align: left !important;
      }
      
      .r-header-main { font-size: var(--header-main-size-print) !important; line-height: 1 !important; margin-top: 0 !important; text-align: center !important; }
      .r-header-branch { font-size: var(--header-branch-size-print) !important; line-height: 1 !important; margin-top: 0 !important; margin-bottom: 2px !important; text-align: center !important; }
      
      .r-dash { margin: 2px 0 !important; }
      
      .barcode-container { 
        margin-top: 0 !important; 
        margin-bottom: 0 !important;
        line-height: 0 !important;
        text-align: left !important;
      }
      .barcode-container svg { 
        width: 100% !important; 
        display: block !important;
        margin: 0 !important;
      }

      .barcode-text { 
        font-size: var(--barcode-text-size-print) !important; 
        letter-spacing: 6px !important; 
        display: block;
        width: 100%;
        margin-top: 0 !important; 
        padding-top: 0 !important;
        line-height: 1 !important;
        font-weight: 400 !important; 
        text-align: center !important;
      }

      .r-www {
        font-size: var(--body-font-size-print) !important;
        text-align: center !important;
      }
      .r-membership-justify {
        font-size: var(--body-font-size-print) !important;
        letter-spacing: -1px !important;
        gap: 0px !important;
        text-align: left !important;
      }
      .r-card-normal {
        font-size: var(--body-font-size-print) !important;
        text-align: left !important;
      }
      .r-price-row {
        font-size: var(--body-font-size-print) !important;
      }
      .r-trx-normal {
        font-size: var(--body-font-size-print) !important;
        text-align: left !important;
      }
      .r-date-left {
        font-size: 8pt !important;
        text-align: left !important;
        white-space: nowrap !important;
      }
      
      /* PRINT: KEKALKAN MAX WIDTH SETIAP KUMPULAN */
      .r-section-header-trx {
        max-width: var(--max-width-header-trx) !important;
      }
      .r-section-item-number {
        max-width: var(--max-width-item-number) !important;
      }
      .r-section-membership-pmy {
        max-width: var(--max-width-membership-pmy) !important;
      }
      .r-section-barcode-last {
        max-width: var(--max-width-barcode-last) !important;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🧾 Multi-Receipt (A4 - Multiple Per Page)</h1>
  
  <div class="receipt-wrapper">
    <!-- FORM INPUT LOG -->
    <div class="form-panel">
      <h2>📋 Paste Log E-Journal:</h2>
      
      <div class="cashier-settings">
        <label>Cashier Name</label>
        <input type="text" id="cashierNameInput" value="SURIATI" placeholder="Contoh: SURIATI">
        
        <label>PMY / Terminal Code</label>
        <input type="text" id="pmyCodeInput" value="PMY LS6.2 20141230" placeholder="Contoh: PMY LS6.2 20141230">
      </div>

      <!-- === MARGIN SETTINGS === -->
      <div class="margin-settings">
        <label>Print Margin <span class="value-display" id="marginValue">10mm</span></label>
        <input type="range" id="marginRange" min="0" max="20" step="1" value="10">
        <div class="hint">Ubah margin kertas A4 semasa print.</div>
      </div>

      <div class="print-warning">
        ⚠️ <strong>Notis Print:</strong> Pastikan anda pilih saiz kertas <strong>A4</strong> dan set <strong>Scale: 100%</strong>.
      </div>

      <textarea id="logInput" class="log-textarea" placeholder="Paste your POS logs here...">***BEGIN SALES***
	|4C PARKSON
	|4C IOI CITY MALL
	|N LOT AT-3, IOI CITY MALL,
	|N LEBUH IRC, SEPANG,62502 PUTRAJAYA
	 
	|N PARKSON CORPORATION SDN BHD
	|N 198601007838(157029-X)
	|N WWW.PARKSON.COM.MY
	 
	|N0245906 077392 316 03 08/11/26 18:33 127
	|BCTRX#:127-316-0245906
 
	|N659222 MHC - PROMO B 4.17
	|N659222 MHC - PROMO BB
	|N 2.00 X 3.57RM 7.14
	|N644143 ZEBRA THERMALWARE
	|N 1.00 X 90.00RM 90.00
	|N----------------------------------------
	|BCTOTAL RM 101.31
	|BCPGV: 1249437810502 -50.00
	|BCVISA -51.30
	|BC VISA CARD NO. 437766******9590
	|NNUMBER OF ITEMS: 4
	 
	|BCROUNDING DOWN -0.01
	 
	|BCMEMBERSHIP NUMBER :M 02010000264593151
	|BCAPV AS AT : 05 NOV 2026
	|BCBALANCE : 949
	|BCREDEEMABLE : 949

Terminal No.: 127-316, Receipt No.: *245906, Log Date: 08/11/26..08/11/26
 
	|NPARKSON CARD : 101.00
	|N----------------------------------------
	***END SALES***</textarea>
      
      <button class="btn-generate" id="generateBtn">🖨️ CONVERT & PRINT</button>
    </div>

    <!-- PREVIEW (A4 PAGE) -->
    <div class="preview-panel">
      <div class="preview-label">🔍 Live Receipt Preview (A4)</div>
      <div id="receiptPreviewContainer" class="a4-page-container">
        <!-- Resit akan dimasukkan di sini -->
      </div>
    </div>
  </div>
</div>

<script>
  const logInput = document.getElementById('logInput');
  const generateBtn = document.getElementById('generateBtn');
  const previewContainer = document.getElementById('receiptPreviewContainer');
  const cashierNameInput = document.getElementById('cashierNameInput');
  const pmyCodeInput = document.getElementById('pmyCodeInput');
  const marginRange = document.getElementById('marginRange');
  const marginValue = document.getElementById('marginValue');

  marginRange.addEventListener('input', function() {
    const val = this.value;
    marginValue.textContent = val + 'mm';
    document.documentElement.style.setProperty('--print-margin', val + 'mm');
  });

  function escapeHtml(text) {
    if (!text) return '';
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
    return text.replace(/[&<>"']/g, m => map[m]);
  }

  function parseSingleReceipt(receiptText, cashier, pmy) {
    let cleanText = receiptText.replace(/[•\x1b]/g, '');
    
    const salesMatch = cleanText.match(/\*\*\*BEGIN SALES\*\*\*([\s\S]*?)\*\*\*END SALES\*\*\*/);
    if (!salesMatch) return null;
    
    let receiptData = salesMatch[1];

    receiptData = receiptData.replace(/Terminal No\.:[^\n]*\n/g, '');
    receiptData = receiptData.replace(/^DV50:.*$/gm, '');
    receiptData = receiptData.replace(/^\s*DV50:.*$/gm, '');

    receiptData = receiptData.replace(/([^\n])(\|N|\|BC|\|4C|\|BCTRX)/g, '$1\n$2');
    receiptData = receiptData.replace(/\|N([A-Z])/g, '|N $1');
    
    const lines = receiptData.split('\n').map(l => l.trim()).filter(l => l);

    let data = {
      storeName: '', branchName: '', addressLines: [], companyLines: [],
      dateLine: '', trxNo: '', linesHtml: [],
      hasFooterNote: false
    };

    let isAddress = true;

    lines.forEach(line => {
      if (!line) return;

      if (line.startsWith('|4C')) {
        const txt = line.substring(3).trim();
        if (!data.storeName) data.storeName = txt;
        else if (!data.branchName) data.branchName = txt;
      }
      else if (line.startsWith('|BCTRX#')) {
        let rawTrx = line.substring(7).trim(); 
        rawTrx = rawTrx.replace(/^:/, ''); 
        data.trxNo = rawTrx;
      }
      else if (line.startsWith('|N')) {
        const txt = line.substring(2).trim();
        if (!txt) return;

        const nClass = 'r-normal';

        if (txt.includes('Purchases may be exchanged')) {
          data.hasFooterNote = true;
        }

        if (isAddress && !txt.includes('SDN BHD') && !txt.includes('19860100')) {
          data.addressLines.push(txt);
        } 
        else if (txt.includes('SDN BHD') || txt.includes('19860100') || txt.includes('WWW.')) {
          isAddress = false;
          data.companyLines.push(txt);
        }
        else if (txt.match(/\d{2}\/\d{2}\/\d{2} \d{2}:\d{2}/)) {
          data.dateLine = txt;
        }
        else if (txt.includes('----')) {
          data.linesHtml.push(`<div class="r-dash"></div>`);
        }
        else if (txt.match(/DISC:|DISCOUNT/i)) {
          const match = txt.match(/^(.*?)\s+(-?[\d\.]+)$/);
          if (match) {
             data.linesHtml.push(`<div class="r-item-row ${nClass}" style="padding-left:10px;">
                        <span class="r-item-name">${escapeHtml(match[1])}</span>
                        <span class="r-item-price">${escapeHtml(match[2])}</span>
                      </div>`);
          } else {
             data.linesHtml.push(`<div class="r-item-row ${nClass}" style="padding-left:10px;">
                        <span class="r-item-name">${escapeHtml(txt)}</span>
                      </div>`);
          }
        }
        else if (txt.match(/PARKSON CARD\s*:\s*([\d\.]+)/i)) {
          const match = txt.match(/PARKSON CARD\s*:\s*([\d\.]+)/i);
          data.linesHtml.push(`<div class="r-item-row ${nClass}" style="padding-left:10px;">
                        <span class="r-item-name">PARKSON CARD :</span>
                        <span class="r-item-price">${escapeHtml(match[1])}</span>
                      </div>`);
        }
        else if (/^\d{6,12}\s+[A-Z]/i.test(txt)) {
          if (txt.match(/\d+\.\d{2}$/) && !txt.includes('X')) {
             const match = txt.match(/^(.*?)\s+(\d+\.\d{2})$/);
             if (match) {
               data.linesHtml.push(`<div class="r-item-row ${nClass}">
                    <span class="r-item-name">${escapeHtml(match[1].trim())}</span>
                    <span class="r-item-price">${escapeHtml(match[2])}</span>
                  </div>`);
             } else {
               data.linesHtml.push(`<div class="${nClass}">${escapeHtml(txt)}</div>`);
             }
          } else {
             data.linesHtml.push(`<div class="${nClass}">${escapeHtml(txt)}</div>`);
          }
        }
        else if (txt.match(/\d+\.\d{2}\s*X\s*\d+\.\d{2}(?:RM)?\s*[\d\.]+/i)) {
          const parts = txt.match(/(\d+\.\d{2})\s*X\s*(\d+\.\d{2})(?:RM)?\s*([\d\.]+)/i);
          if (parts) {
             data.linesHtml.push(`<div class="r-item-row ${nClass}" style="padding-left:10px;">
                     <span class="r-item-name">${escapeHtml(parts[1])} x ${escapeHtml(parts[2])}RM</span>
                     <span class="r-item-price">${escapeHtml(parts[3])}</span>
                   </div>`);
          } else {
             data.linesHtml.push(`<div class="${nClass}" style="padding-left:10px;">${escapeHtml(txt)}</div>`);
          }
        }
        else if (txt.startsWith('S/N:')) {
          data.linesHtml.push(`<div class="${nClass}" style="font-size:0.8rem;">${escapeHtml(txt)}</div>`);
        }
        else if (txt.includes('NUMBER OF ITEMS')) {
          const match = txt.match(/NUMBER OF ITEMS:\s*(\d+)/i);
          const count = match ? match[1] : '';
          data.linesHtml.push(`<div class="r-price-row ${nClass}"><span class="r-label">Number of Items:</span><span class="r-value">${escapeHtml(count)}</span></div>`);
        }
        else if (txt.match(/NORMAL POINTS|EXTRA POINTS|TOTAL POINTS/i)) {
          const match = txt.match(/^(.*?)\s*:\s*([\d\.]+)$/);
          if (match) {
             data.linesHtml.push(`<div class="r-item-row ${nClass}" style="padding-left:10px;">
                        <span class="r-item-name">${escapeHtml(match[1].trim())} :</span>
                        <span class="r-item-price">${escapeHtml(match[2].trim())}</span>
                      </div>`);
          } else {
             data.linesHtml.push(`<div class="${nClass}">${escapeHtml(txt)}</div>`);
          }
        }
        else if (txt.match(/BALANCE|REDEEMABLE/i)) {
          const match = txt.match(/^(.*?)\s*:\s*([\d\.A-Z]+)$/);
          if (match) {
             data.linesHtml.push(`<div class="r-nowrap ${nClass}">${escapeHtml(match[1].trim())} :${escapeHtml(match[2].trim())}</div>`);
          } else {
             data.linesHtml.push(`<div class="${nClass}">${escapeHtml(txt)}</div>`);
          }
        }
        else if (txt.match(/MEMBERSHIP NUMBER/i)) {
           const parts = txt.split(':');
           if (parts.length >= 2) {
               const label = parts[0].trim() + ' :';
               const value = parts.slice(1).join(':').trim();
               data.linesHtml.push(`<div class="r-membership-justify"><span>${escapeHtml(label)}</span><span>${escapeHtml(value)}</span></div>`);
           } else {
               data.linesHtml.push(`<div class="${nClass}">${escapeHtml(txt)}</div>`);
           }
        }
        else if (txt.match(/APV AS AT/i)) {
           data.linesHtml.push(`<div class="${nClass}">${escapeHtml(txt)}</div>`);
        }
        else {
           data.linesHtml.push(`<div class="${nClass}">${escapeHtml(txt)}</div>`);
        }
      }
      else if (line.startsWith('|BC')) {
        const txt = line.substring(3).trim();
        
        const bcClass = 'r-bold';

        if (txt.startsWith('TOTAL RM')) {
          const amount = txt.replace('TOTAL RM', '').trim();
          data.linesHtml.push(`<div class="r-price-row ${bcClass}"><span class="r-label">Total RM</span><span class="r-value">${escapeHtml(amount)}</span></div>`);
        } 
        else if (txt.startsWith('PGV:')) {
          const parts = txt.split(' ');
          const amount = parts.pop();
          const label = parts.join(' ');
          data.linesHtml.push(`<div class="r-price-row ${bcClass}"><span class="r-label">${escapeHtml(label)}</span><span class="r-value">${escapeHtml(amount)}</span></div>`);
        }
        else if (txt.startsWith('ROUNDING DOWN')) {
          const parts = txt.split(' ');
          const amount = parts.pop();
          const label = parts.join(' ');
          data.linesHtml.push(`<div class="r-price-row ${bcClass}"><span class="r-label">${escapeHtml(label)}</span><span class="r-value">${escapeHtml(amount)}</span></div>`);
        }
        else if (txt.startsWith('MASTER CARD NO.') || txt.startsWith('VISA CARD NO.')) {
          data.linesHtml.push(`<div class="r-card-normal">${escapeHtml(txt)}</div>`);
        }
        else if (txt.startsWith('CASH')) {
          const amount = txt.replace('CASH', '').trim();
          data.linesHtml.push(`<div class="r-price-row ${bcClass}"><span class="r-label">CASH</span><span class="r-value">${escapeHtml(amount)}</span></div>`);
        }
        else if (txt.startsWith('MASTER')) {
          const amount = txt.replace('MASTER', '').trim();
          data.linesHtml.push(`<div class="r-price-row ${bcClass}"><span class="r-label">MASTER</span><span class="r-value">${escapeHtml(amount)}</span></div>`);
        }
        else if (txt.startsWith('VISA')) {
          const amount = txt.replace('VISA', '').trim();
          data.linesHtml.push(`<div class="r-price-row ${bcClass}"><span class="r-label">VISA</span><span class="r-value">${escapeHtml(amount)}</span></div>`);
        }
        else if (txt.startsWith('ED*:')) {
          const lastSpace = txt.lastIndexOf(' ');
          if (lastSpace !== -1) {
             const ref = txt.substring(0, lastSpace);
             const amount = txt.substring(lastSpace + 1);
             data.linesHtml.push(`<div class="r-price-row ${bcClass}"><span class="r-label">${escapeHtml(ref)}</span><span class="r-value">${escapeHtml(amount)}</span></div>`);
          } else {
             data.linesHtml.push(`<div class="${bcClass}">${escapeHtml(txt)}</div>`);
          }
        }
        else if (txt.startsWith('EV:')) {
          let cleanEv = txt.replace(/^EV:\s*/, 'EV: ');
          cleanEv = cleanEv.replace(/(\w+):(\d+)/, '$1 : $2');
          data.linesHtml.push(`<div class="r-nowrap ${bcClass}">${escapeHtml(cleanEv)}</div>`);
        }
        else {
           data.linesHtml.push(`<div class="${bcClass}">${escapeHtml(txt)}</div>`);
        }
      }
    });

    if (!data.storeName) data.storeName = 'PARKSON';
    if (!data.branchName) data.branchName = 'IOI CITY MALL';
    if (data.addressLines.length === 0) data.addressLines = ['LOT AT-3, IOI CITY MALL,', 'LEBUH IRC, SEPANG,62502 PUTRAJAYA'];
    if (data.companyLines.length === 0) data.companyLines = ['PARKSON CORPORATION SDN BHD', '198601007838(157029-X)', 'WWW.PARKSON.COM.MY'];
    
    let html = `<div class="receipt-preview-item">`;
    
    // ========================================================
    // SECTION 1: HEADER → TRX# (MAX WIDTH 6.5CM)
    // ========================================================
    html += `<div class="r-section-header-trx">`;
    html += `<div class="r-center r-header-main">${escapeHtml(data.storeName)}</div>`;
    html += `<div class="r-center r-header-branch">${escapeHtml(data.branchName)}</div>`;
    
    data.addressLines.forEach(line => {
      html += `<div class="r-center r-normal">${escapeHtml(line)}</div>`;
    });

    html += `<div class="r-center r-normal" style="margin-top:2px;">`;
    data.companyLines.forEach(line => {
      if (line.includes('WWW.')) {
          html += `<div class="r-www">${escapeHtml(line)}</div>`;
      } else {
          html += `<div>${escapeHtml(line)}</div>`;
      }
    });
    html += `</div>`;

    if (data.dateLine) {
      html += `<div class="r-date-left">${escapeHtml(data.dateLine)}</div>`;
    }

    let trxDisplay = data.trxNo;
    if(trxDisplay.startsWith(':')) {
        trxDisplay = trxDisplay.substring(1);
    }
    html += `<div class="r-trx-normal">Trx#:${escapeHtml(trxDisplay)}</div>`;
    html += `</div>`;
    
    html += `<div style="margin-bottom:2px;"></div>`;

    // ========================================================
    // SECTION 2: ITEM → NUMBER OF ITEMS (MAX WIDTH 6.0CM)
    // ========================================================
    html += `<div class="r-section-item-number">`;
    
    data.linesHtml.forEach(htmlLine => {
        html += htmlLine;
    });
    
    if (!data.hasFooterNote) {
        html += `<div class="r-justify r-normal" style="width: 100%;">Purchases may be exchanged or returned within 7 days (product exclusion applies). Any vouchers redeemed must be surrendered else the amount will be deducted from the refund. Terms apply.</div>`;
        html += `<div class="r-center r-normal">customerservice@parkson.com.my</div>`;
        html += `<div class="r-center r-normal">THANK YOU FOR YOUR PATRONAGE</div>`;
    }

    html += `<div class="r-bold" style="width: 100%; text-align: left;">****************************************</div>`;
    html += `<div class="r-bold" style="width: 100%; text-align: left;">* YOU ORDER, WE DELIVER!</div>`;
    html += `<div class="r-bold" style="width: 100%; text-align: left;">* Shop NOW at parksononline.com.my</div>`;
    html += `<div class="r-normal" style="width: 100%; text-align: left;">* Register NOW to enjoy RM10 OFF</div>`;
    html += `<div class="r-normal" style="width: 100%; text-align: left;">  your first order</div>`;
    html += `<div class="r-normal" style="width: 100%; text-align: left;">* FREE SHIPPING across West Msia*</div>`;
    html += `<div class="r-normal" style="width: 100%; text-align: left;">Terms Apply</div>`;
    html += `<div class="r-bold" style="width: 100%; text-align: left;">****************************************</div>`;

    html += `<div class="r-normal">Cashier Name : ${escapeHtml(cashier)}</div>`;
    html += `<div class="r-normal">${escapeHtml(pmy)}</div>`;
    html += `</div>`;

    // BARCODE
    let barcodeDisplayText = data.trxNo;
    barcodeDisplayText = barcodeDisplayText.replace(/[^0-9-]/g, '');
    let parts = barcodeDisplayText.split('-');

    if (parts.length === 3) {
        let p1 = parts[0]; 
        let p2 = parts[1]; 
        let p3 = parts[2]; 
        let cleanP3 = p3.replace(/^0+/, ''); 
        let formattedP3 = '000' + cleanP3.padStart(6, '0');
        barcodeDisplayText = 'T' + '000' + p1 + '-' + p2 + formattedP3;
    } else {
        barcodeDisplayText = 'T' + barcodeDisplayText.replace(/-/g, '');
    }

    // ========================================================
    // SECTION 4: BARCODE → LAST LINE (MAX WIDTH 6.5CM)
    // ========================================================
    html += `<div class="r-section-barcode-last">`;
    html += `<div class="barcode-container">`;
    html += `<svg class="barcode-svg" data-value="${escapeHtml(barcodeDisplayText)}"></svg>`;
    html += `</div>`;
    html += `<div class="barcode-text">${escapeHtml(barcodeDisplayText)}</div>`;
    html += `</div>`;

    html += `</div>`;

    return html;
  }

  function updatePreview() {
    const log = logInput.value;
    const cashier = cashierNameInput.value;
    const pmy = pmyCodeInput.value;
    
    previewContainer.innerHTML = '';
    
    const regex = /\*\*\*BEGIN SALES\*\*\*[\s\S]*?\*\*\*END SALES\*\*\*/g;
    const matches = log.match(regex);

    if (matches && matches.length > 0) {
        matches.forEach(chunk => {
            const html = parseSingleReceipt(chunk, cashier, pmy);
            if (html) {
                previewContainer.innerHTML += html;
            }
        });
    } else {
        previewContainer.innerHTML = `<div class="r-center" style="color:red; padding: 20px; width: 100%;">❌ Tiada format ***BEGIN SALES*** yang sah dijumpai.</div>`;
    }

    setTimeout(() => {
        const barcodeElements = document.querySelectorAll('.barcode-svg');
        barcodeElements.forEach(svg => {
          const val = svg.getAttribute('data-value');
          if (val) {
            try {
              JsBarcode(svg, val, {
                format: "CODE128",
                width: 1.8,
                height: 18, 
                displayValue: false,
                margin: 0
              });
            } catch (e) {
              console.error("Barcode error:", e);
            }
          }
        });
    }, 50);
  }

  logInput.addEventListener('input', updatePreview);
  cashierNameInput.addEventListener('input', updatePreview);
  pmyCodeInput.addEventListener('input', updatePreview);
  
  generateBtn.addEventListener('click', (e) => {
    e.preventDefault();
    updatePreview();
    setTimeout(() => window.print(), 300); 
  });

  marginValue.textContent = marginRange.value + 'mm';
  document.documentElement.style.setProperty('--print-margin', marginRange.value + 'mm');

  updatePreview();
</script>
</body>
</html>

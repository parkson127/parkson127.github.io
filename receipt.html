<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Receipt — A4 Auto Split (Fixed)</title>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <style>
    :root {
      --body-font-size: 9.5pt;
      --header-main-size: 2rem;
      --header-branch-size: 2rem;
      --barcode-text-size: 1.1rem;
      --max-width-header-trx: 6.5cm;
      --max-width-item-number: 6.0cm;
      --max-width-membership-pmy: 6.5cm;
      --max-width-barcode-last: 6.5cm;
      --receipt-width: 3in;
      --a4-width: 8.27in;
      --a4-height: 11.69in;
      --a4-padding: 0.4in;
      --col-gap: 0.5in;
      --print-margin: 0mm;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Consolas', 'Lucida Console', 'Courier New', monospace; }
    body { background: #f3f4f6; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .container { max-width: 1400px; width: 100%; background: white; border-radius: 24px; box-shadow: 0 20px 35px rgba(0,0,0,0.1); padding: 30px; }
    h1 { font-size: 1.5rem; font-weight: 600; color: #1e293b; text-align: center; margin-bottom: 25px; border-bottom: 2px dashed #cbd5e1; padding-bottom: 15px; font-family: sans-serif; }
    .receipt-wrapper { display: flex; flex-wrap: wrap; gap: 30px; }
    
    .form-panel { flex: 1; min-width: 380px; background: #f8fafc; border-radius: 18px; padding: 20px; border: 1px solid #e2e8f0; display: flex; flex-direction: column; }
    .form-panel h2 { font-size: 1.1rem; margin-bottom: 10px; color: #0f172a; font-family: sans-serif; }
    
    .per-receipt-cashier {
      background: #dbeafe; padding: 10px; border-radius: 8px;
      margin-bottom: 10px; border-left: 4px solid #3b82f6;
    }
    .per-receipt-cashier .r-label {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.75rem; font-weight: 700; color: #1e40af;
      margin-bottom: 4px; font-family: sans-serif;
    }
    .per-receipt-cashier .r-label .trx-tag {
      font-size: 0.65rem; color: #64748b; font-weight: 400;
      font-family: 'Consolas', monospace;
    }
    .per-receipt-cashier input {
      width: 100%; padding: 6px 10px; border: 1px solid #93c5fd;
      border-radius: 6px; font-family: 'Consolas', monospace;
      font-size: 0.85rem; background: white;
    }
    
    .pmy-global {
      background: #fef3c7; padding: 10px; border-radius: 8px;
      margin-bottom: 15px; border-left: 4px solid #f59e0b;
    }
    .pmy-global label {
      display: block; font-size: 0.75rem; font-weight: 700;
      color: #92400e; margin-bottom: 4px; font-family: sans-serif;
    }
    .pmy-global input {
      width: 100%; padding: 6px 10px; border: 1px solid #fcd34d;
      border-radius: 6px; font-family: 'Consolas', monospace;
      font-size: 0.85rem; background: white;
    }

    .margin-control {
      background: #e2e8f0; padding: 10px; border-radius: 8px;
      margin-bottom: 15px;
    }
    .margin-control label {
      display: block; font-size: 0.75rem; font-weight: 700;
      color: #334155; margin-bottom: 4px; font-family: sans-serif;
    }
    .margin-control .value-display {
      display: inline-block; background: #cbd5e1;
      padding: 2px 8px; border-radius: 4px; font-size: 0.8rem;
      margin-left: 8px; font-weight: 600;
    }
    .margin-control input[type="range"] { width: 100%; }
    
    .log-textarea {
      width: 100%; flex: 1; min-height: 400px; padding: 15px;
      border: 1px solid #cbd5e1; border-radius: 12px;
      font-family: 'Consolas', monospace; font-size: 0.85rem;
      background: #0f172a; color: #38bdf8; resize: vertical;
      line-height: 1.4; margin-bottom: 15px;
    }
    .log-textarea:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.2); }
    
    .print-warning {
      background: #fffbeb; border: 1px solid #fcd34d; color: #b45309;
      padding: 10px; border-radius: 8px; font-size: 0.8rem;
      margin-bottom: 15px; display: flex; align-items: flex-start;
      gap: 8px; font-family: sans-serif; line-height: 1.4;
    }
    .btn-generate {
      width: 100%; background: #10b981; color: white; border: none;
      padding: 15px; border-radius: 12px; font-weight: 700;
      font-size: 1rem; cursor: pointer; transition: 0.2s;
      display: flex; align-items: center; justify-content: center;
      gap: 10px; font-family: sans-serif;
    }
    .btn-generate:hover { background: #059669; transform: translateY(-2px); }
    
    .preview-panel {
      flex: 1.5; min-width: 350px; background: white;
      border-radius: 12px; padding: 15px; border: 2px dashed #cbd5e1;
      display: flex; flex-direction: column; align-items: center;
      overflow-x: auto; max-height: 85vh;
    }
    .preview-label {
      font-size: 0.8rem; text-transform: uppercase; color: #64748b;
      margin-bottom: 10px; font-weight: 600; text-align: center;
      font-family: sans-serif;
    }
    
    .receipt-preview-item {
      background: #fff; padding: 10px 5px;
      font-family: 'Consolas', monospace; font-weight: 400;
      font-size: var(--body-font-size); line-height: 1.05;
      color: #000; width: 3in; min-width: 3in; max-width: 3in;
      box-shadow: 0 0 10px rgba(0,0,0,0.05); letter-spacing: -1.2px;
      margin-bottom: 20px; border-bottom: 2px dashed #94a3b8;
      padding-bottom: 10px; text-align: left;
    }
    .receipt-preview-item:last-child { margin-bottom: 0; border-bottom: none; padding-bottom: 0; }
    
    .r-center { text-align: center !important; }
    .r-left { text-align: left !important; }
    .r-justify { text-align: justify !important; }
    .r-bold { font-weight: 900; }
    .r-normal { font-weight: 400; text-align: left; }
    .r-dash { border-top: 1px dashed #000; margin: 3px 0; }
    
    .r-item-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 5px; width: 100%; }
    .r-item-name { flex: 1; text-align: left; }
    .r-item-price { white-space: nowrap; text-align: right; }
    .r-nowrap { white-space: nowrap !important; display: block; width: 100%; text-align: left; }
    
    .r-section-header-trx { max-width: var(--max-width-header-trx); width: 100%; margin: 0; }
    .r-section-item-number { max-width: var(--max-width-item-number); width: 100%; margin: 0; }
    .r-section-membership-pmy { max-width: var(--max-width-membership-pmy); width: 100%; margin: 0; }
    .r-section-barcode-last { max-width: var(--max-width-barcode-last); width: 100%; margin: 0; }
    
    .r-header-main { font-size: var(--header-main-size); font-weight: 900; letter-spacing: 1px; line-height: 1; margin-top: 0; margin-bottom: 0; text-align: center; }
    .r-header-branch { font-size: var(--header-branch-size); font-weight: 900; letter-spacing: 1px; margin-bottom: 2px; margin-top: 0; text-align: center; }
    
    .barcode-container { text-align: left; margin-top: 0px; margin-bottom: 0; line-height: 0; }
    .barcode-container svg { max-width: 100%; height: auto; display: block; margin: 0; }
    .barcode-text { text-align: center; font-size: var(--barcode-text-size); letter-spacing: 3px; font-weight: 400 !important; margin-top: 0; padding-top: 0; white-space: nowrap; display: block; width: 100%; line-height: 1; }
    
    .r-www { text-align: center; width: 100%; letter-spacing: normal; }
    .r-membership-justify { display: flex; align-items: flex-start; gap: 0px; width: 100%; font-size: var(--body-font-size); font-weight: 600; white-space: nowrap; letter-spacing: -1px; text-align: left; }
    .r-date-left { font-size: 8.3pt; font-weight: 400; letter-spacing: 0.1px; text-align: left; width: 100%; white-space: nowrap; overflow: hidden; }
    .r-trx-normal { font-size: var(--body-font-size); font-weight: 900; letter-spacing: normal; width: 100%; text-align: left; }
    
    .r-trx-flex {
      display: flex; justify-content: space-between;
      align-items: flex-start; gap: 5px; width: 100%;
      font-size: var(--body-font-size); font-weight: 900;
      letter-spacing: normal;
    }
    .r-trx-flex .r-trx-label { text-align: left; flex: 1; white-space: nowrap; }
    .r-trx-flex .r-trx-star { text-align: right; white-space: nowrap; }
    
    .r-card-normal { font-size: var(--body-font-size); font-weight: 900; letter-spacing: normal; width: 100%; text-align: left; }
    .r-price-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 5px; width: 100%; font-weight: 900; }
    .r-price-row .r-label { text-align: left; flex: 1; }
    .r-price-row .r-value { text-align: right; white-space: nowrap; }

    .r-returned-title {
      font-size: var(--body-font-size); letter-spacing: -0.3px;
      white-space: nowrap; text-align: left; width: 100%;
      overflow: hidden; font-weight: 900; line-height: 1.1;
    }
    .r-returned-detail {
      font-size: var(--body-font-size); letter-spacing: -0.3px;
      white-space: nowrap; text-align: left; width: 100%;
      overflow: hidden; font-weight: 400; line-height: 1.1;
    }

    .r-einvoice-remark-log {
      font-size: var(--body-font-size); font-weight: 900;
      text-align: left; width: 100%; margin-top: 3px;
      line-height: 1.1; color: #000;
    }

    .r-einvoice-remark {
      font-size: 10.1pt; font-weight: 400; text-align: left;
      width: 100%; margin-top: 3px; line-height: 1.1; color: #000;
    }

    .a4-preview-page {
      width: 8.27in; height: 11.69in; background: #fff;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      padding: 0.4in; margin: 0 auto 20px auto;
      box-sizing: border-box; display: grid;
      grid-template-columns: 1fr 1fr; gap: 0.5in;
      overflow: hidden; position: relative;
    }
    .a4-preview-page::after {
      content: "A4"; position: absolute; top: 4px; right: 6px;
      font-size: 9px; color: #94a3b8; font-family: sans-serif;
      letter-spacing: 1px;
    }
    .a4-single-col { grid-template-columns: 1fr; }
    .split-part {
      width: 100%;
      height: 100%;
      min-height: calc(11.69in - 0.8in);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .split-part > .receipt-preview-item {
      margin: 0 !important; padding-bottom: 0 !important;
      border-bottom: none !important; box-shadow: none !important;
      padding-top: 0 !important;
    }

    @media print {
      @page { size: A4 portrait; margin: 0; }
      html, body { 
        background: white !important; padding: 0 !important; margin: 0 !important;
        width: 8.27in !important; display: block !important;
        -webkit-print-color-adjust: exact; print-color-adjust: exact;
      }
      .container, .receipt-wrapper, .preview-panel { 
        box-shadow: none !important; padding: 0 !important; margin: 0 !important;
        max-width: 100% !important; width: 100% !important;
        border: none !important; overflow: visible !important;
        display: block !important; background: white !important;
      }
      h1, .form-panel, .preview-label, .print-warning { display: none !important; }
      #receiptPreviewContainer { display: block !important; width: 100% !important; }
      .a4-preview-page {
        width: 8.27in !important; height: 11.69in !important;
        box-shadow: none !important; padding: 0.4in !important; margin: 0 !important;
        page-break-after: always; break-after: page; overflow: hidden !important;
      }
      .a4-preview-page:last-child { page-break-after: auto; break-after: auto; }
      .a4-preview-page::after { display: none !important; }
      .receipt-preview-item { 
        width: 3in !important; max-width: 3in !important;
        font-size: var(--body-font-size) !important; font-weight: 600 !important; 
        padding: 0 !important; margin: 0 !important;
        line-height: 1.05 !important; box-shadow: none !important;
        letter-spacing: -1.2px; border-bottom: none !important;
        padding-bottom: 0 !important; text-align: left !important;
      }
      .r-header-main { font-size: var(--header-main-size) !important; line-height: 1 !important; margin-top: 0 !important; text-align: center !important; }
      .r-header-branch { font-size: var(--header-branch-size) !important; line-height: 1 !important; margin-top: 0 !important; margin-bottom: 2px !important; text-align: center !important; }
      .r-dash { margin: 2px 0 !important; }
      .barcode-container { margin-top: 0 !important; margin-bottom: 0 !important; line-height: 0 !important; text-align: left !important; }
      .barcode-container svg { width: 100% !important; display: block !important; margin: 0 !important; }
      .barcode-text { font-size: var(--barcode-text-size) !important; letter-spacing: 6px !important; display: block; width: 100%; margin-top: 0 !important; padding-top: 0 !important; line-height: 1 !important; font-weight: 400 !important; text-align: center !important; }
      .r-www { text-align: center !important; }
      .r-membership-justify { letter-spacing: -1px !important; gap: 0px !important; text-align: left !important; }
      .r-card-normal { text-align: left !important; }
      .r-trx-normal { text-align: left !important; }
      .r-trx-flex { display: flex !important; justify-content: space-between !important; }
      .r-date-left { font-size: 8.3pt !important; text-align: left !important; white-space: nowrap !important; }
      .r-einvoice-remark { font-size: var(--body-font-size) !important; text-align: left !important; }
      .r-einvoice-remark-log { font-size: var(--body-font-size) !important; text-align: left !important; }
      .r-returned-title { font-size: 9.5pt !important; text-align: left !important; white-space: nowrap !important; }
      .r-returned-detail { font-size: 8.5pt !important; text-align: left !important; white-space: nowrap !important; }
      .split-part { min-height: 0 !important; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🖨️ Multi-Receipt → A4 (Auto Split Fixed)</h1>
  
  <div class="receipt-wrapper">
    <div class="form-panel">
      <h2>📋 Paste Log E-Journal:</h2>

      <textarea id="logInput" class="log-textarea" placeholder="Paste your POS logs here..."></textarea>

      <div id="cashierInputsContainer"></div>

      <div class="pmy-global">
        <label>PMY Code (sama untuk semua resit)</label>
        <input type="text" id="pmyCodeInput" value="PMY LS6.2 20141230" placeholder="Contoh: PMY LS6.2 20141230">
      </div>

      <div class="margin-control">
        <label>Print Margin <span class="value-display" id="marginValue">0mm</span></label>
        <input type="range" id="marginRange" min="0" max="20" step="1" value="0">
      </div>

      <div class="print-warning">
        <span>⚠️</span>
        <div>
          <strong>Notis Print A4:</strong><br>
          • Paper: <strong>A4</strong><br>
          • Scale: <strong>100%</strong> (jangan "Fit to page")<br>
          • Margin: <strong>None / 0</strong><br>
          • Background graphics: <strong>ON</strong>
        </div>
      </div>

      <button class="btn-generate" id="generateBtn">🖨️ CONVERT & PRINT</button>
    </div>

    <div class="preview-panel">
      <div class="preview-label">🔍 Live A4 Preview</div>
      <div id="receiptPreviewContainer" style="display: flex; flex-direction: column; align-items: center; width: 100%;"></div>
    </div>
  </div>
</div>

<script>
  const logInput = document.getElementById('logInput');
  const generateBtn = document.getElementById('generateBtn');
  const previewContainer = document.getElementById('receiptPreviewContainer');
  const cashierInputsContainer = document.getElementById('cashierInputsContainer');
  const pmyCodeInput = document.getElementById('pmyCodeInput');
  const marginRange = document.getElementById('marginRange');
  const marginValue = document.getElementById('marginValue');

  const PAYMENT_TYPES = [
    'VISA', 'MASTER', 'MASTERCARD', 'AMEX', 'AMERICAN EXPRESS',
    'CASH', 'BOOST', 'GRABPAY', 'TNG', 'TOUCH N GO', 'TNG EWALLET',
    'QR', 'QRPAY', 'DUITNOW', 'FPX', 'ONLINE BANKING',
    'VOUCHER', 'PGV', 'EV', 'ED', 'CARD', 'DEBIT', 'CREDIT',
    'ALIPAY', 'WECHAT', 'UNIONPAY', 'JCB', 'PAYPAL', 'SHOPEEPAY',
    'MAE', 'CIMB', 'MAYBANK', 'PUBLIC BANK', 'RHB', 'HONG LEONG',
    'INSTALLMENT', 'EPP', 'BNPL', 'ATOME', 'SPAYLATER', 'HUTANG',
    'SHOPEEPAY', 'LAZADA', 'ZALORA', 'FOODPANDA', 'GRABFOOD',
    'DEBIT CARD', 'CREDIT CARD'
  ];

  let cashierNames = [];
  const DEFAULT_CASHIER = 'SURIATI';

  // Override style untuk ukur — sama dengan render dalam .split-part
  const MEASURE_STYLE = 'padding:0 !important; margin:0 !important; border:none !important; box-shadow:none !important;';

  function toTitleCase(str) {
    return str.replace(/\w\S*/g, function(txt) {
      return txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase();
    });
  }

  function escapeHtml(text) {
    if (!text) return '';
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
    return text.replace(/[&<>"']/g, m => map[m]);
  }

  function rebuildCashierInputs() {
    const log = logInput.value;
    const matches = log.match(/\*\*\*BEGIN SALES\*\*\*[\s\S]*?\*\*\*END SALES\*\*\*/g);
    const count = matches ? matches.length : 0;

    const newNames = [];
    for (let i = 0; i < count; i++) {
      newNames.push(cashierNames[i] !== undefined ? cashierNames[i] : DEFAULT_CASHIER);
    }
    cashierNames = newNames;

    cashierInputsContainer.innerHTML = '';
    for (let i = 0; i < count; i++) {
      let trxTag = '';
      if (matches && matches[i]) {
        const trxMatch = matches[i].match(/\|BCTRX#:\s*([^\s\n]+)/);
        if (trxMatch) trxTag = 'Trx#: ' + trxMatch[1];
      }

      const div = document.createElement('div');
      div.className = 'per-receipt-cashier';
      div.innerHTML = `
        <label class="r-label">
          <span>Resit ${i + 1} — Cashier</span>
          <span class="trx-tag">${escapeHtml(trxTag)}</span>
        </label>
        <input type="text" data-index="${i}" value="${escapeHtml(cashierNames[i])}" placeholder="Nama cashier resit ${i + 1}">
      `;
      cashierInputsContainer.appendChild(div);
    }

    cashierInputsContainer.querySelectorAll('input[data-index]').forEach(input => {
      input.addEventListener('input', (e) => {
        const idx = parseInt(e.target.getAttribute('data-index'), 10);
        cashierNames[idx] = e.target.value;
        updatePreview();
      });
    });
  }

  function parseSingleReceipt(receiptText, cashier, pmy) {
    let cleanText = receiptText.replace(/[•\x1b]/g, '');
    
    const salesMatch = cleanText.match(/\*\*\*BEGIN SALES\*\*\*([\s\S]*?)\*\*\*END SALES\*\*\*/);
    if (!salesMatch) return null;
    
    let receiptData = salesMatch[1];

    receiptData = receiptData.replace(/Terminal No\.:[^\n]*\n/g, '');
    receiptData = receiptData.replace(/^DV50:.*$/gm, '');
    receiptData = receiptData.replace(/^\s*DV50:.*$/gm, '');

    receiptData = receiptData.replace(/([^\n])(\|N|\|BC|\|4C|\|BCTRX)/g, '$1\n$2');
    receiptData = receiptData.replace(/\|N([A-Z])/g, '|N $1');
    
    const lines = receiptData.split('\n').map(l => l.trim()).filter(l => l);

    let data = {
      storeName: '', branchName: '', addressLines: [], companyLines: [],
      dateLine: '', trxNo: '', trxStars: '',
      bodyItems: [],
      hasFooterNote: false,
      hasEInvoiceRemark: false,
      eInvoiceRemarkText: '',
      returnedItemTitle: '',
      returnedItemDetail: ''
    };

    let isAddress = true;
    let inEInvoiceRemark = false;

    lines.forEach(line => {
      if (!line) return;

      if (line.startsWith('|4C')) {
        const txt = line.substring(3).trim();
        if (!data.storeName) data.storeName = txt;
        else if (!data.branchName) data.branchName = txt;
      }
      else if (line.startsWith('|BCTRX#')) {
        let rawTrx = line.substring(7).trim(); 
        rawTrx = rawTrx.replace(/^:/, ''); 
        const starMatch = rawTrx.match(/\s*\*+\s*$/);
        if (starMatch) {
          data.trxStars = starMatch[0].trim();
          rawTrx = rawTrx.replace(/\s*\*+\s*$/, '').trim();
        }
        data.trxNo = rawTrx;
      }
      else if (line.startsWith('|N')) {
        const txt = line.substring(2).trim();
        if (!txt) return;

        const nClass = 'r-normal';

        if (txt.includes('Purchases may be exchanged')) {
          data.hasFooterNote = true;
        }

        if (isAddress && !txt.includes('SDN BHD') && !txt.includes('19860100')) {
          data.addressLines.push(txt);
        } 
        else if (txt.includes('SDN BHD') || txt.includes('19860100') || txt.includes('WWW.')) {
          isAddress = false;
          data.companyLines.push(txt);
        }
        else if (txt.match(/\d{2}\/\d{2}\/\d{2} \d{2}:\d{2}/)) {
          data.dateLine = txt;
        }
        else if (txt.includes('----')) {
          data.bodyItems.push(`<div class="r-dash"></div>`);
        }
        else if (txt.match(/DISC:|DISCOUNT/i)) {
          const match = txt.match(/^(.*?)\s+(-?[\d\.,]+)$/);
          if (match) {
             data.bodyItems.push(`<div class="r-item-row ${nClass}" style="padding-left:10px;">
                        <span class="r-item-name">${escapeHtml(match[1])}</span>
                        <span class="r-item-price">${escapeHtml(match[2])}</span>
                      </div>`);
          } else {
             data.bodyItems.push(`<div class="r-item-row ${nClass}" style="padding-left:10px;">
                        <span class="r-item-name">${escapeHtml(txt)}</span>
                      </div>`);
          }
        }
        else if (txt.match(/PARKSON CARD\s*:\s*([\d\.,]+)/i)) {
          const match = txt.match(/PARKSON CARD\s*:\s*([\d\.,]+)/i);
          data.bodyItems.push(`<div class="r-item-row ${nClass}" style="padding-left:10px;">
                        <span class="r-item-name">PARKSON CARD :</span>
                        <span class="r-item-price">${escapeHtml(match[1])}</span>
                      </div>`);
        }
        else if (/^\d{6,12}\s+[A-Z]/i.test(txt)) {
          if (txt.match(/[\d\.,]+$/) && !txt.includes('X')) {
             const match = txt.match(/^(.*?)\s+([\d\.,]+)$/);
             if (match) {
               data.bodyItems.push(`<div class="r-item-row ${nClass}">
                    <span class="r-item-name">${escapeHtml(match[1].trim())}</span>
                    <span class="r-item-price">${escapeHtml(match[2])}</span>
                  </div>`);
             } else {
               data.bodyItems.push(`<div class="${nClass}">${escapeHtml(txt)}</div>`);
             }
          } else {
             data.bodyItems.push(`<div class="${nClass}">${escapeHtml(txt)}</div>`);
          }
        }
        else if (txt.match(/[\d\.,]+\s*X\s*[\d\.,]+(?:RM)?\s*[\d\.,]+/i)) {
          const parts = txt.match(/([\d\.,]+)\s*X\s*([\d\.,]+)(?:RM)?\s*([\d\.,]+)/i);
          if (parts) {
             data.bodyItems.push(`<div class="r-item-row ${nClass}" style="padding-left:10px;">
                     <span class="r-item-name">${escapeHtml(parts[1])} x ${escapeHtml(parts[2])}RM</span>
                     <span class="r-item-price">${escapeHtml(parts[3])}</span>
                   </div>`);
          } else {
             data.bodyItems.push(`<div class="${nClass}" style="padding-left:10px;">${escapeHtml(txt)}</div>`);
          }
        }
        else if (txt.startsWith('S/N:')) {
          data.bodyItems.push(`<div class="${nClass}" style="font-size:0.8rem;">${escapeHtml(txt)}</div>`);
        }
        else if (txt.includes('NUMBER OF ITEMS')) {
          const match = txt.match(/NUMBER OF ITEMS:\s*(\d+)/i);
          const count = match ? match[1] : '';
          data.bodyItems.push(`<div class="r-price-row ${nClass}"><span class="r-label">Number of Items:</span><span class="r-value">${escapeHtml(count)}</span></div>`);
        }
        else if (txt.match(/NORMAL POINTS|EXTRA POINTS|TOTAL POINTS/i)) {
          const match = txt.match(/^(.*?)\s*:\s*([\d\.,]+)$/);
          if (match) {
             data.bodyItems.push(`<div class="r-item-row ${nClass}" style="padding-left:10px;">
                        <span class="r-item-name">${escapeHtml(match[1].trim())} :</span>
                        <span class="r-item-price">${escapeHtml(match[2].trim())}</span>
                      </div>`);
          } else {
             data.bodyItems.push(`<div class="${nClass}">${escapeHtml(txt)}</div>`);
          }
        }
        else if (txt.match(/BALANCE|REDEEMABLE/i)) {
          const match = txt.match(/^(.*?)\s*:\s*([\d\.,A-Z]+)$/);
          if (match) {
             data.bodyItems.push(`<div class="r-nowrap ${nClass}">${escapeHtml(match[1].trim())} :${escapeHtml(match[2].trim())}</div>`);
          } else {
             data.bodyItems.push(`<div class="${nClass}">${escapeHtml(txt)}</div>`);
          }
        }
        else if (txt.match(/MEMBERSHIP NUMBER/i)) {
           const parts = txt.split(':');
           if (parts.length >= 2) {
               const label = parts[0].trim() + ' :';
               const value = parts.slice(1).join(':').trim();
               data.bodyItems.push(`<div class="r-membership-justify"><span>${escapeHtml(label)}</span><span>${escapeHtml(value)}</span></div>`);
           } else {
               data.bodyItems.push(`<div class="${nClass}">${escapeHtml(txt)}</div>`);
           }
        }
        else if (txt.match(/APV AS AT/i)) {
           data.bodyItems.push(`<div class="${nClass}">${escapeHtml(txt)}</div>`);
        }
        else {
           data.bodyItems.push(`<div class="${nClass}">${escapeHtml(txt)}</div>`);
        }
      }
      else if (line.startsWith('|BC')) {
        const txt = line.substring(3).trim();
        const bcClass = 'r-bold';

        if (txt.startsWith('RETURNED ITEM(S)')) {
          data.returnedItemTitle = txt;
          return;
        }
        if (txt.startsWith('(ORG TRX#')) {
          data.returnedItemDetail = txt;
          return;
        }

        if (txt.startsWith('(PLEASE PROCEED TO THE CUSTOMER SERVICE') ||
            txt.startsWith('(PLEASE PROCEED') ||
            txt.includes('REDEEM YOUR VOUCHERS') ||
            txt.includes('PURCHASE EXCEEDING RM10,000')) {
          data.hasEInvoiceRemark = true;
          if (!inEInvoiceRemark) {
            data.eInvoiceRemarkText = txt;
            inEInvoiceRemark = true;
          } else {
            data.eInvoiceRemarkText += ' ' + txt;
          }
          return;
        }

        if (txt.startsWith('TOTAL RM')) {
          const amount = txt.replace('TOTAL RM', '').trim();
          data.bodyItems.push(`<div class="r-price-row ${bcClass}"><span class="r-label">Total RM</span><span class="r-value">${escapeHtml(amount)}</span></div>`);
        } 
        else if (txt.startsWith('ROUNDING DOWN') || txt.startsWith('ROUNDING UP')) {
          const parts = txt.split(' ');
          const amount = parts.pop();
          const label = parts.join(' ');
          data.bodyItems.push(`<div class="r-price-row ${bcClass}"><span class="r-label">${escapeHtml(label)}</span><span class="r-value">${escapeHtml(amount)}</span></div>`);
        }
        else if (txt.match(/CARD NO\./i) || txt.match(/CARD NUMBER/i)) {
          data.bodyItems.push(`<div class="r-card-normal">${escapeHtml(txt)}</div>`);
        }
        else if (txt.startsWith('ED*:')) {
          const lastSpace = txt.lastIndexOf(' ');
          if (lastSpace !== -1) {
            const ref = txt.substring(0, lastSpace);
            const amount = txt.substring(lastSpace + 1);
            data.bodyItems.push(`<div class="r-price-row ${bcClass}"><span class="r-label">${escapeHtml(ref)}</span><span class="r-value">${escapeHtml(amount)}</span></div>`);
          } else {
            data.bodyItems.push(`<div class="${bcClass}">${escapeHtml(txt)}</div>`);
          }
        }
        else if (txt.startsWith('EV:')) {
          let cleanEv = txt.replace(/^EV:\s*/, 'EV: ');
          cleanEv = cleanEv.replace(/(\w+):(\d+)/, '$1 : $2');
          data.bodyItems.push(`<div class="r-nowrap ${bcClass}">${escapeHtml(cleanEv)}</div>`);
        }
        else {
          let foundPayment = false;
          for (const pt of PAYMENT_TYPES) {
            if (txt.toUpperCase().startsWith(pt)) {
              foundPayment = true;
              break;
            }
          }

          if (foundPayment) {
            const lastSpace = txt.lastIndexOf(' ');
            if (lastSpace !== -1) {
              const label = txt.substring(0, lastSpace).trim();
              const amount = txt.substring(lastSpace + 1).trim();
              if (/^[+-]?[\d\.,]+$/.test(amount)) {
                data.bodyItems.push(`<div class="r-price-row ${bcClass}"><span class="r-label">${escapeHtml(label)}</span><span class="r-value">${escapeHtml(amount)}</span></div>`);
              } else {
                data.bodyItems.push(`<div class="${bcClass}">${escapeHtml(txt)}</div>`);
              }
            } else {
              data.bodyItems.push(`<div class="${bcClass}">${escapeHtml(txt)}</div>`);
            }
          } else {
            data.bodyItems.push(`<div class="${bcClass}">${escapeHtml(txt)}</div>`);
          }
        }
      }
    });

    if (data.returnedItemDetail) {
      data.bodyItems.unshift(`<div class="r-returned-detail">${escapeHtml(data.returnedItemDetail)}</div>`);
    }
    if (data.returnedItemTitle) {
      data.bodyItems.unshift(`<div class="r-returned-title">${escapeHtml(data.returnedItemTitle)}</div>`);
    }

    if (data.eInvoiceRemarkText) {
      const cleanText = data.eInvoiceRemarkText.trim();
      const titleCaseText = toTitleCase(cleanText);
      data.bodyItems.push(`<div class="r-einvoice-remark-log">${escapeHtml(titleCaseText)}</div>`);
    }

    if (!data.storeName) data.storeName = 'PARKSON';
    if (!data.branchName) data.branchName = 'IOI CITY MALL';
    if (data.addressLines.length === 0) data.addressLines = ['LOT AT-3, IOI CITY MALL,', 'LEBUH IRC, SEPANG,62502 PUTRAJAYA'];
    if (data.companyLines.length === 0) data.companyLines = ['PARKSON CORPORATION SDN BHD', '198601007838(157029-X)', 'www.parkson.com.my'];

    let headerHtml = `<div class="r-section-header-trx">`;
    headerHtml += `<div class="r-center r-header-main">${escapeHtml(data.storeName)}</div>`;
    headerHtml += `<div class="r-center r-header-branch">${escapeHtml(data.branchName)}</div>`;
    data.addressLines.forEach(line => {
      headerHtml += `<div class="r-center r-normal">${escapeHtml(line)}</div>`;
    });
    headerHtml += `<div class="r-center r-normal" style="margin-top:2px;">`;
    data.companyLines.forEach(line => {
      if (line.includes('WWW.')) {
           headerHtml += `<div class="r-www">${escapeHtml(line.toLowerCase())}</div>`;
      } else {
          headerHtml += `<div>${escapeHtml(line)}</div>`;
      }
    });
    headerHtml += `</div>`;
    if (data.dateLine) {
      headerHtml += `<div class="r-date-left">${escapeHtml(data.dateLine)}</div>`;
    }
    let trxDisplay = data.trxNo;
    if(trxDisplay.startsWith(':')) trxDisplay = trxDisplay.substring(1);
    
    if (data.trxStars) {
      headerHtml += `<div class="r-trx-flex"><span class="r-trx-label">Trx#:${escapeHtml(trxDisplay)}</span><span class="r-trx-star">${escapeHtml(data.trxStars)}</span></div>`;
    } else {
      headerHtml += `<div class="r-trx-normal">Trx#:${escapeHtml(trxDisplay)}</div>`;
    }
    headerHtml += `</div>`;
    headerHtml += `<div style="margin-bottom:2px;"></div>`;

    let barcodeDisplayText = data.trxNo;
    barcodeDisplayText = barcodeDisplayText.replace(/[^0-9-]/g, '');
    let parts = barcodeDisplayText.split('-');

    if (parts.length === 3) {
        let p1 = parts[0]; 
        let p2 = parts[1]; 
        let p3 = parts[2]; 
        let cleanP3 = p3.replace(/^0+/, ''); 
        let formattedP3 = '000' + cleanP3.padStart(6, '0');
        barcodeDisplayText = 'T' + '000' + p1 + '-' + p2 + formattedP3;
    } else {
        barcodeDisplayText = 'T' + barcodeDisplayText.replace(/-/g, '');
    }

    let footerHtml = `<div class="r-section-barcode-last">`;
    footerHtml += `<div class="barcode-container">`;
    footerHtml += `<svg class="barcode-svg" data-value="${escapeHtml(barcodeDisplayText)}"></svg>`;
    footerHtml += `</div>`;
    footerHtml += `<div class="barcode-text">${escapeHtml(barcodeDisplayText)}</div>`;
    
    if (data.hasEInvoiceRemark) {
      footerHtml += `<div class="r-einvoice-remark">Transactions exceeding RM10,000 require a mandatory e-invoice issuance at Customer Service</div>`;
    }
    
    footerHtml += `</div>`;

    let footerNoteHtml = '';
    if (!data.hasFooterNote) {
        footerNoteHtml += `<div class="r-justify r-normal" style="width: 100%;">Purchases may be exchanged or returned within 7 days (product exclusion applies). Any vouchers redeemed must be surrendered else the amount will be deducted from the refund. Terms apply.</div>`;
        footerNoteHtml += `<div class="r-center r-normal">customerservice@parkson.com.my</div>`;
        footerNoteHtml += `<div class="r-center r-normal">THANK YOU FOR YOUR PATRONAGE</div>`;
    }

    let promoHtml = `<div class="r-bold" style="width: 100%; text-align: left;">****************************************</div>`;
    promoHtml += `<div class="r-bold" style="width: 100%; text-align: left;">* YOU ORDER, WE DELIVER!</div>`;
    promoHtml += `<div class="r-bold" style="width: 100%; text-align: left;">* Shop NOW at parksononline.com.my</div>`;
    promoHtml += `<div class="r-normal" style="width: 100%; text-align: left;">* Register NOW to enjoy RM10 OFF</div>`;
    promoHtml += `<div class="r-normal" style="width: 100%; text-align: left;">  your first order</div>`;
    promoHtml += `<div class="r-normal" style="width: 100%; text-align: left;">* FREE SHIPPING across West Msia*</div>`;
    promoHtml += `<div class="r-normal" style="width: 100%; text-align: left;">Terms Apply</div>`;
    promoHtml += `<div class="r-bold" style="width: 100%; text-align: left;">****************************************</div>`;

    let cashierHtml = `<div class="r-normal">Cashier Name : ${escapeHtml(cashier)}</div>`;
    cashierHtml += `<div class="r-normal">${escapeHtml(pmy)}</div>`;

    return { headerHtml, bodyItems: data.bodyItems, footerNoteHtml, promoHtml, cashierHtml, footerHtml, barcodeDisplayText };
  }

  function buildFullHtml(r) {
    return `<div class="receipt-preview-item">
      ${r.headerHtml}
      <div class="r-section-item-number">
        ${r.bodyItems.join('')}
        ${r.footerNoteHtml}
        ${r.promoHtml}
        ${r.cashierHtml}
      </div>
      ${r.footerHtml}
    </div>`;
  }

  /* =========================================================================
     A4 COLUMN HEIGHT — NILAI TETAP (dikira dari CSS)
     A4 = 11.69in, padding 0.4in × 2 = 0.8in
     Usable = 10.89in × 96dpi = 1045px
     ========================================================================= */
  function getA4ColumnHeight() {
    const A4_IN = 11.69;
    const PADDING_IN = 0.4;   // .a4-preview-page padding
    const PX_PER_IN = 96;
    const usable = (A4_IN - PADDING_IN * 2) * PX_PER_IN;
    return Math.floor(usable) - 4; // 1041px, -4px safety
  }

  /* =========================================================================
     SPLIT RECEIPT IKUT TINGGI COLUMN A4 SEBENAR
     - Ukur guna style override (padding/margin 0) supaya sama dengan render
     - Header hanya di part pertama
     - Footer (barcode + remark) hanya di part terakhir
     - Footer note / promo / cashier dianggap tail items
     ========================================================================= */
  function splitReceiptIntoParts(r, columnHeight) {
    const tailItems = [
      ...r.bodyItems.map(html => ({ html })),
      { html: r.footerNoteHtml },
      { html: r.promoHtml },
      { html: r.cashierHtml },
    ].filter(x => x.html);

    const temp = document.createElement('div');
    temp.style.cssText = 'position:absolute; left:-99999px; top:0; width:3in;';
    document.body.appendChild(temp);

    // Ukur header (padding/margin 0 override)
    temp.innerHTML = `<div class="receipt-preview-item" style="${MEASURE_STYLE}">${r.headerHtml}</div>`;
    const headerH = temp.querySelector('.receipt-preview-item').getBoundingClientRect().height;

    // Ukur setiap item (padding/margin 0 override)
    const itemHeights = tailItems.map(it => {
      temp.innerHTML = `<div class="receipt-preview-item" style="${MEASURE_STYLE}"><div class="r-section-item-number">${it.html}</div></div>`;
      return temp.querySelector('.receipt-preview-item').getBoundingClientRect().height;
    });

    // Ukur footer (padding/margin 0 override)
    temp.innerHTML = `<div class="receipt-preview-item" style="${MEASURE_STYLE}">${r.footerHtml}</div>`;
    const footerH = temp.querySelector('.receipt-preview-item').getBoundingClientRect().height;

    temp.remove();

    const MAX = columnHeight;
    const parts = [];
    let current = [];
    let currentH = headerH;
    let isFirstPart = true;

    for (let i = 0; i < tailItems.length; i++) {
      const h = itemHeights[i];

      // Item tak muat → tutup part, mula part baru
      if (currentH + h > MAX && current.length > 0) {
        parts.push({ items: current, includeHeader: isFirstPart });
        isFirstPart = false;
        current = [];
        currentH = 0;
      }

      current.push(tailItems[i].html);
      currentH += h;
    }

    // Part terakhir perlu ruang untuk footer
    if (current.length > 0) {
      if (currentH + footerH > MAX && current.length > 1) {
        const last = current.pop();
        parts.push({ items: current, includeHeader: isFirstPart });
        isFirstPart = false;
        current = [last];
      }
      parts.push({ items: current, includeHeader: isFirstPart, includeFooter: true });
    } else if (parts.length > 0) {
      parts[parts.length - 1].includeFooter = true;
    } else {
      parts.push({ items: [], includeHeader: true, includeFooter: true });
    }

    // Debug log
    console.log('[SPLIT]', {
      trx: r.barcodeDisplayText,
      columnHeight,
      headerH: Math.round(headerH),
      footerH: Math.round(footerH),
      itemCount: itemHeights.length,
      totalItemH: Math.round(itemHeights.reduce((a, b) => a + b, 0)),
      partsCount: parts.length,
      partsItemCounts: parts.map(p => p.items.length)
    });

    // Warning kalau 1 item sahaja melebihi 1 column (tak boleh split lagi)
    if (parts.length === 1 && (headerH + itemHeights.reduce((a, b) => a + b, 0) + footerH) > MAX) {
      console.warn('[SPLIT] Item tunggal lebih tinggi dari column A4 — akan overflow.');
    }

    return parts.map(p => `<div class="receipt-preview-item">
      ${p.includeHeader ? r.headerHtml : ''}
      <div class="r-section-item-number">${p.items.join('')}</div>
      ${p.includeFooter ? r.footerHtml : ''}
    </div>`);
  }

  function updatePreview() {
    const log = logInput.value;
    const pmy = pmyCodeInput.value;
    
    previewContainer.innerHTML = '';
    
    const regex = /\*\*\*BEGIN SALES\*\*\*[\s\S]*?\*\*\*END SALES\*\*\*/g;
    const matches = log.match(regex);

    if (!matches || matches.length === 0) {
        previewContainer.innerHTML = `<div class="r-center" style="color:red; padding: 20px;">❌ Tiada format ***BEGIN SALES*** yang sah dijumpai.</div>`;
        return;
    }

    const receipts = [];
    matches.forEach((chunk, i) => {
      const cashier = cashierNames[i] !== undefined ? cashierNames[i] : DEFAULT_CASHIER;
      const r = parseSingleReceipt(chunk, cashier, pmy);
      if (r) receipts.push(r);
    });

    const A4_COLUMN_H = getA4ColumnHeight();

    // Ukur tinggi setiap receipt penuh (hidden, guna MEASURE_STYLE)
    const hiddenWrap = document.createElement('div');
    hiddenWrap.style.cssText = 'position:absolute; left:-99999px; top:0; visibility:hidden; width:3in;';
    document.body.appendChild(hiddenWrap);
    hiddenWrap.innerHTML = receipts.map(r => buildFullHtml(r).replace('class="receipt-preview-item"', `class="receipt-preview-item" style="${MEASURE_STYLE}"`)).join('');
    const fullItems = hiddenWrap.querySelectorAll('.receipt-preview-item');
    const heights = Array.from(fullItems).map(el => el.getBoundingClientRect().height);
    hiddenWrap.remove();

    /* =======================================================================
       PAGINATION
       - Receipt ≤ A4_COLUMN_H → "short", pair 2-per-page
       - Receipt > A4_COLUMN_H → "split" jadi N part ikut A4_COLUMN_H
       - Split parts dipair 2-per-page → auto new page
       ======================================================================= */
    const SHORT_THRESHOLD = A4_COLUMN_H;

    const pages = [];
    let shortQueue = [];

    function flushShortQueue() {
      while (shortQueue.length > 0) {
        if (shortQueue.length >= 2) {
          pages.push({ type: 'pair', indices: [shortQueue.shift(), shortQueue.shift()] });
        } else {
          pages.push({ type: 'single', indices: [shortQueue.shift()] });
        }
      }
    }

    heights.forEach((h, i) => {
      if (h > SHORT_THRESHOLD) {
        flushShortQueue();
        const partsHtml = splitReceiptIntoParts(receipts[i], A4_COLUMN_H);
        for (let k = 0; k < partsHtml.length; k += 2) {
          pages.push({ type: 'parts', htmls: partsHtml.slice(k, k + 2) });
        }
      } else {
        shortQueue.push(i);
        if (shortQueue.length === 2) {
          pages.push({ type: 'pair', indices: [shortQueue.shift(), shortQueue.shift()] });
        }
      }
    });
    flushShortQueue();

    // Render pages
    let finalHtml = '';
    pages.forEach(page => {
      if (page.type === 'parts') {
        const cols = page.htmls;
        if (cols.length === 2) {
          finalHtml += `<div class="a4-preview-page">`;
          finalHtml += `<div class="split-part">${cols[0]}</div>`;
          finalHtml += `<div class="split-part">${cols[1]}</div>`;
          finalHtml += `</div>`;
        } else {
          finalHtml += `<div class="a4-preview-page a4-single-col">`;
          finalHtml += `<div class="split-part" style="grid-column: 1 / -1;">${cols[0]}</div>`;
          finalHtml += `</div>`;
        }
      } else if (page.type === 'pair') {
        const [a, b] = page.indices;
        finalHtml += `<div class="a4-preview-page">`;
        finalHtml += `<div class="split-part">${buildFullHtml(receipts[a])}</div>`;
        finalHtml += `<div class="split-part">${buildFullHtml(receipts[b])}</div>`;
        finalHtml += `</div>`;
      } else {
        const idx = page.indices[0];
        finalHtml += `<div class="a4-preview-page a4-single-col">`;
        finalHtml += `<div class="split-part" style="grid-column: 1 / -1;">${buildFullHtml(receipts[idx])}</div>`;
        finalHtml += `</div>`;
      }
    });

    previewContainer.innerHTML = finalHtml;

    console.log('[PAGE]', {
      A4_COLUMN_H,
      receiptCount: receipts.length,
      receiptHeights: heights.map(h => Math.round(h)),
      pageCount: pages.length
    });

    // Render barcode
    setTimeout(() => {
        document.querySelectorAll('.barcode-svg').forEach(svg => {
          const val = svg.getAttribute('data-value');
          if (val) {
            try {
              JsBarcode(svg, val, { format: "CODE128", width: 1.8, height: 18, displayValue: false, margin: 0 });
            } catch (e) { console.error("Barcode error:", e); }
          }
        });
    }, 50);
  }

  logInput.addEventListener('input', () => {
    rebuildCashierInputs();
    updatePreview();
  });
  pmyCodeInput.addEventListener('input', updatePreview);
  
  generateBtn.addEventListener('click', (e) => {
    e.preventDefault();
    updatePreview();
    setTimeout(() => window.print(), 400); 
  });

  marginRange.addEventListener('input', function() {
    const val = this.value;
    marginValue.textContent = val + 'mm';
    document.documentElement.style.setProperty('--print-margin', val + 'mm');
  });

  // Init — tunggu DOM + CSS ready
  if (document.readyState === 'complete') {
    rebuildCashierInputs();
    updatePreview();
  } else {
    window.addEventListener('load', () => {
      rebuildCashierInputs();
      updatePreview();
    });
  }
</script>

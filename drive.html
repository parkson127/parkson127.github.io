<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌌 Black Hole Storage</title>
  <style>
    /* Sama seperti sebelumnya, atau guna style ringkas */
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0a0a0a;
      font-family: Arial, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 800px; width:100%; }
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
    .blackhole {
      width:200px; height:200px; border-radius:50%;
      background: radial-gradient(circle, #000 30%, #2a1a3a 70%, #9c27b0);
      box-shadow: 0 0 60px rgba(156,39,176,0.4);
      cursor: pointer;
      margin: 20px auto;
      transition: transform 0.3s;
      animation: pulse 3s infinite;
    }
    .blackhole:hover { transform: scale(1.05); }
    @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.02);} }
    .status-panel {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 20px;
      margin: 20px 0;
    }
    .progress { height:6px; background:#333; border-radius:10px; overflow:hidden; }
    .progress-fill { height:100%; background: linear-gradient(90deg,#9c27b0,#2196f3); transition: width 0.5s; }
    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px,1fr));
      gap: 12px;
    }
    .file-item {
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      position: relative;
    }
    .file-item .delete {
      position: absolute; top:5px; right:8px;
      background:none; border:none; color:#f44336; cursor:pointer;
    }
    .toast {
      position: fixed; bottom:20px; left:50%; transform:translateX(-50%);
      background: #222; padding:12px 24px; border-radius:10px;
      border:1px solid #9c27b0; opacity:0; transition:0.5s;
    }
    .toast.show { opacity:1; }
    .btn {
      padding:8px 20px; border:none; border-radius:8px;
      background: #9c27b0; color:#fff; cursor:pointer;
    }
    .btn:disabled { opacity:0.5; cursor:not-allowed; }
    input[type="file"] { display:none; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🌌 Black Hole</h1>
    <span id="userIdDisplay">👤 ...</span>
  </div>

  <!-- Black Hole -->
  <div class="blackhole" id="blackhole" title="Klik untuk upload"></div>
  <input type="file" id="fileInput" multiple>

  <!-- Status -->
  <div class="status-panel">
    <div style="display:flex; justify-content:space-between;">
      <span>Storan</span>
      <span id="storageText">0 GB / 10 GB</span>
    </div>
    <div class="progress"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div style="display:flex; justify-content:space-between; margin-top:10px;">
      <span id="statusText">✅ Available</span>
      <span id="fileCount">0 fail</span>
      <button class="btn" id="refreshBtn">🔄 Refresh</button>
    </div>
  </div>

  <!-- File List -->
  <div class="file-grid" id="fileGrid"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ============ KONFIGURASI ============
const API_URL = "YOUR_APPS_SCRIPT_URL"; // Ganti dengan URL Apps Script anda
const USER_ID = "user"; // ID TETAP – semua peranti guna sama

// ============ ELEMEN ============
const blackhole = document.getElementById('blackhole');
const fileInput = document.getElementById('fileInput');
const fileGrid = document.getElementById('fileGrid');
const progressFill = document.getElementById('progressFill');
const storageText = document.getElementById('storageText');
const statusText = document.getElementById('statusText');
const fileCount = document.getElementById('fileCount');
const toast = document.getElementById('toast');
const refreshBtn = document.getElementById('refreshBtn');
const userIdDisplay = document.getElementById('userIdDisplay');

userIdDisplay.textContent = '👤 ' + USER_ID;

// ============ TOAST ============
function showToast(msg, type='info') {
  toast.textContent = msg;
  toast.className = 'toast show';
  if (type === 'error') toast.style.borderColor = '#f44336';
  else toast.style.borderColor = '#4caf50';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toast.classList.remove('show'), 4000);
}

// ============ API CALL ============
async function callAPI(data) {
  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    return await response.json();
  } catch (e) {
    showToast('❌ Gagal berhubung dengan backend', 'error');
    return { success: false, error: e.message };
  }
}

// ============ LOAD STATUS & FILES ============
async function loadData() {
  // Get status
  const status = await callAPI({ action: 'getStatus', userId: USER_ID });
  if (status.success) {
    const used = status.used;
    const max = status.max;
    const percent = (used/max)*100;
    storageText.textContent = `${(used/1e9).toFixed(2)} GB / ${(max/1e9).toFixed(0)} GB`;
    progressFill.style.width = Math.min(percent,100) + '%';
    if (status.isFull) {
      statusText.textContent = '🚫 Full';
      statusText.style.color = '#f44336';
    } else if (percent > 80) {
      statusText.textContent = '⚠️ Almost Full';
      statusText.style.color = '#ff9800';
    } else {
      statusText.textContent = '✅ Available';
      statusText.style.color = '#4caf50';
    }
  }

  // Get files
  const result = await callAPI({ action: 'list', userId: USER_ID });
  if (result.success) {
    fileCount.textContent = result.count + ' fail';
    renderFiles(result.files);
  }
}

// ============ RENDER FILES ============
function renderFiles(files) {
  if (!files || files.length === 0) {
    fileGrid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#666; padding:40px;">🌌 Tiada fail. Seret atau klik lubang hitam.</div>`;
    return;
  }
  let html = '';
  files.forEach(file => {
    const days = file.daysLeft !== null ? file.daysLeft : '?';
    const urgency = days <= 3 ? '🔴' : days <= 7 ? '🟡' : '🟢';
    html += `
      <div class="file-item">
        <button class="delete" data-id="${file.id}">✕</button>
        <div style="font-size:32px;">📄</div>
        <div style="font-size:13px; word-break:break-all;">${file.name}</div>
        <div style="font-size:11px; color:#888;">${(file.size/1024).toFixed(1)} KB</div>
        <div style="font-size:11px;">${urgency} ${days} hari lagi</div>
      </div>
    `;
  });
  fileGrid.innerHTML = html;

  // Event delete
  document.querySelectorAll('.file-item .delete').forEach(btn => {
    btn.addEventListener('click', async function(e) {
      e.stopPropagation();
      const id = this.dataset.id;
      if (!confirm('Padam fail ini?')) return;
      const result = await callAPI({ action: 'delete', fileId: id, userId: USER_ID });
      if (result.success) {
        showToast('🗑️ Fail dipadam', 'success');
        loadData();
      } else {
        showToast('❌ Gagal padam', 'error');
      }
    });
  });
}

// ============ UPLOAD ============
async function uploadFiles(files) {
  if (!files || files.length === 0) return;

  for (let i=0; i<files.length; i++) {
    const file = files[i];
    try {
      // Baca sebagai base64
      const reader = new FileReader();
      const base64 = await new Promise((resolve, reject) => {
        reader.onload = e => resolve(e.target.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });

      const payload = {
        action: 'upload',
        userId: USER_ID,
        filename: file.name,
        mimeType: file.type || 'application/octet-stream',
        size: file.size,
        content: base64
      };

      showToast(`🌌 Menelan ${file.name}...`, 'info');
      const result = await callAPI(payload);
      if (result.success) {
        showToast(`✅ ${file.name} ditelan!`, 'success');
      } else {
        showToast(`❌ Gagal: ${result.error}`, 'error');
      }
    } catch (e) {
      showToast(`❌ Ralat: ${e.message}`, 'error');
    }
  }
  loadData();
}

// ============ EVENT ============
blackhole.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', function() {
  if (this.files.length) {
    uploadFiles(this.files);
    this.value = '';
  }
});

// Drag & drop
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', async e => {
  e.preventDefault();
  if (e.dataTransfer.files.length) {
    await uploadFiles(e.dataTransfer.files);
  }
});

refreshBtn.addEventListener('click', loadData);

// ============ LOAD ============
loadData();
</script>
</body>
</html>

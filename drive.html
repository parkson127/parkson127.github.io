<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌌 Black Hole Storage</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0a0a0a;
      font-family: Arial, sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 800px; width:100%; }
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px; }
    .blackhole {
      width:200px; height:200px; border-radius:50%;
      background: radial-gradient(circle, #000 30%, #2a1a3a 70%, #9c27b0);
      box-shadow: 0 0 60px rgba(156,39,176,0.4);
      cursor: pointer;
      margin: 20px auto;
      transition: transform 0.3s;
      animation: pulse 3s infinite;
      position:relative;
    }
    .blackhole:hover { transform: scale(1.05); }
    .blackhole:active { transform: scale(0.95); }
    @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.02);} }
    .accretion {
      position:absolute; top:50%; left:50%; width:120%; height:40%;
      transform:translate(-50%,-50%) rotateX(75deg);
      background: radial-gradient(ellipse, rgba(156,39,176,0.3) 0%, rgba(33,150,243,0.2) 40%, transparent 70%);
      border-radius:50%;
      animation: spin 8s linear infinite;
      pointer-events:none;
    }
    @keyframes spin { 0%{transform:translate(-50%,-50%) rotateX(75deg) rotate(0deg);} 100%{transform:translate(-50%,-50%) rotateX(75deg) rotate(360deg);} }
    .status-panel {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 20px;
      margin: 20px 0;
      backdrop-filter:blur(10px);
      border:1px solid rgba(156,39,176,0.2);
    }
    .progress { height:6px; background:#333; border-radius:10px; overflow:hidden; margin:10px 0; }
    .progress-fill { height:100%; background: linear-gradient(90deg,#9c27b0,#2196f3); transition: width 0.5s; }
    .status-row { display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-top:10px; }
    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px,1fr));
      gap: 12px;
      margin-top:20px;
    }
    .file-item {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 15px 12px;
      text-align: center;
      position: relative;
      border:1px solid rgba(255,255,255,0.05);
      transition:0.3s;
    }
    .file-item:hover { background:rgba(255,255,255,0.08); transform:translateY(-2px); }
    .file-item .delete {
      position: absolute; top:5px; right:8px;
      background:none; border:none; color:#f44336; cursor:pointer;
      font-size:16px; padding:4px 8px; border-radius:50%;
    }
    .file-item .delete:hover { background:rgba(244,67,54,0.1); }
    .file-icon { font-size:36px; margin-bottom:5px; }
    .file-name { font-size:13px; word-break:break-all; color:#ddd; }
    .file-size { font-size:11px; color:#888; }
    .file-expiry { font-size:11px; margin-top:5px; }
    .file-expiry.urgent { color:#f44336; }
    .file-expiry.warning { color:#ff9800; }
    .file-expiry.safe { color:#4caf50; }
    .toast {
      position: fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(100px);
      background: rgba(20,20,40,0.95); padding:14px 28px; border-radius:12px;
      border:1px solid #9c27b0; opacity:0; transition:0.5s all; z-index:1000;
      backdrop-filter:blur(10px); max-width:90%; text-align:center;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    .toast.success { border-color:#4caf50; }
    .toast.error { border-color:#f44336; }
    .btn {
      padding:8px 20px; border:none; border-radius:8px;
      background: #9c27b0; color:#fff; cursor:pointer; font-weight:600;
      transition:0.3s;
    }
    .btn:hover { transform:translateY(-2px); box-shadow:0 4px 20px rgba(156,39,176,0.4); }
    .btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
    .btn-secondary { background:rgba(255,255,255,0.1); }
    input[type="file"] { display:none; }
    .empty-state { grid-column:1/-1; text-align:center; color:#666; padding:40px; }
    .empty-state .icon { font-size:60px; margin-bottom:15px; }
    .upload-overlay {
      display:none; position:fixed; top:0; left:0; width:100%; height:100%;
      background:rgba(0,0,0,0.7); backdrop-filter:blur(5px); z-index:999;
      justify-content:center; align-items:center; flex-direction:column; gap:15px;
    }
    .upload-overlay.active { display:flex; }
    .upload-spinner {
      width:50px; height:50px; border:4px solid rgba(156,39,176,0.2);
      border-top:4px solid #9c27b0; border-radius:50%;
      animation:spin 1s linear infinite;
    }
    @keyframes spin { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
    .upload-text { color:#fff; font-size:16px; }
    @media (max-width:600px) {
      .blackhole { width:150px; height:150px; }
      .file-grid { grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1 style="font-size:24px;">🌌 Black Hole</h1>
    <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
      <span style="font-size:12px; color:#888; background:rgba(255,255,255,0.05); padding:4px 12px; border-radius:12px;" id="userIdDisplay">👤 ...</span>
      <button class="btn btn-secondary" id="refreshBtn">🔄</button>
    </div>
  </div>

  <!-- Black Hole -->
  <div class="blackhole" id="blackhole" title="Klik untuk upload">
    <div class="accretion"></div>
  </div>
  <input type="file" id="fileInput" multiple>

  <!-- Status Panel -->
  <div class="status-panel">
    <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:5px;">
      <span>📦 Storan Digunakan</span>
      <span id="storageText">0 GB / 10 GB</span>
    </div>
    <div class="progress"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="status-row">
      <span id="statusText">✅ Available</span>
      <span id="fileCount">0 fail</span>
      <span id="expiryInfo" style="font-size:12px; color:#888;">⏳ 15 hari auto-delete</span>
    </div>
  </div>

  <!-- File Grid -->
  <div class="file-grid" id="fileGrid"></div>
</div>

<!-- Upload Overlay -->
<div class="upload-overlay" id="uploadOverlay">
  <div class="upload-spinner"></div>
  <div class="upload-text" id="uploadText">🌌 Menelan fail...</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ============ KONFIGURASI ============
const API_URL = "https://script.google.com/macros/s/AKfycbxiIpcpm_flWk0wqPpXw1HSmGULOASWu5mbwSMPePx2MFTh7p4vc68dLVbjshRz47g0gw/exec"; // Ganti dengan URL Google Apps Script
const USER_ID = "user"; // ID TETAP - tukar ikut suka

// ============ ELEMEN ============
const blackhole = document.getElementById('blackhole');
const fileInput = document.getElementById('fileInput');
const fileGrid = document.getElementById('fileGrid');
const progressFill = document.getElementById('progressFill');
const storageText = document.getElementById('storageText');
const statusText = document.getElementById('statusText');
const fileCount = document.getElementById('fileCount');
const toast = document.getElementById('toast');
const refreshBtn = document.getElementById('refreshBtn');
const userIdDisplay = document.getElementById('userIdDisplay');
const uploadOverlay = document.getElementById('uploadOverlay');
const uploadText = document.getElementById('uploadText');

userIdDisplay.textContent = '👤 ' + USER_ID;

// ============ TOAST ============
function showToast(msg, type = 'info') {
  toast.textContent = msg;
  toast.className = 'toast show ' + type;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toast.classList.remove('show'), 4000);
}

// ============ API CALL ============
async function callAPI(data) {
  try {
    // Hantar sebagai FormData untuk elak CORS
    const formData = new FormData();
    formData.append('payload', JSON.stringify(data));
    
    const response = await fetch(API_URL, {
      method: 'POST',
      body: formData
    });
    
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }
    
    return await response.json();
    
  } catch (e) {
    console.error('API Error:', e);
    showToast('❌ Gagal berhubung: ' + e.message, 'error');
    return { success: false, error: e.message };
  }
}

// ============ LOAD DATA ============
async function loadData() {
  try {
    // Get status
    const status = await callAPI({ action: 'getStatus', userId: USER_ID });
    if (status.success) {
      const used = status.used || 0;
      const max = status.max || 10 * 1024 * 1024 * 1024;
      const percent = (used / max) * 100;
      storageText.textContent = `${(used / 1e9).toFixed(2)} GB / ${(max / 1e9).toFixed(0)} GB`;
      progressFill.style.width = Math.min(percent, 100) + '%';
      
      if (status.isFull) {
        statusText.textContent = '🚫 Full';
        statusText.style.color = '#f44336';
      } else if (percent > 80) {
        statusText.textContent = '⚠️ Almost Full';
        statusText.style.color = '#ff9800';
      } else {
        statusText.textContent = '✅ Available';
        statusText.style.color = '#4caf50';
      }
    }

    // Get files
    const result = await callAPI({ action: 'list', userId: USER_ID });
    if (result.success) {
      fileCount.textContent = (result.count || 0) + ' fail';
      renderFiles(result.files || []);
    }
    
  } catch (e) {
    console.error('Load error:', e);
    showToast('❌ Ralat memuat data', 'error');
  }
}

// ============ RENDER FILES ============
function renderFiles(files) {
  if (!files || files.length === 0) {
    fileGrid.innerHTML = `
      <div class="empty-state">
        <div class="icon">🌌</div>
        <h3 style="color:#888; margin-bottom:8px;">Tiada Fail</h3>
        <p style="color:#666; font-size:14px;">Seret fail atau klik lubang hitam</p>
      </div>
    `;
    return;
  }
  
  let html = '';
  files.forEach(file => {
    const days = file.daysLeft !== undefined ? file.daysLeft : '?';
    let expiryClass = 'safe';
    let icon = '📄';
    if (days <= 3) expiryClass = 'urgent';
    else if (days <= 7) expiryClass = 'warning';
    
    // Pilih icon berdasarkan extension
    const ext = file.name.split('.').pop().toLowerCase();
    if (['jpg','jpeg','png','gif','webp','svg'].includes(ext)) icon = '🖼️';
    else if (['mp4','avi','mov','mkv'].includes(ext)) icon = '🎬';
    else if (['mp3','wav','flac'].includes(ext)) icon = '🎵';
    else if (['pdf'].includes(ext)) icon = '📄';
    else if (['doc','docx'].includes(ext)) icon = '📝';
    else if (['xls','xlsx'].includes(ext)) icon = '📊';
    else if (['zip','rar','7z'].includes(ext)) icon = '📦';
    
    html += `
      <div class="file-item">
        <button class="delete" data-id="${file.id}">✕</button>
        <div class="file-icon">${icon}</div>
        <div class="file-name">${file.name}</div>
        <div class="file-size">${(file.size / 1024).toFixed(1)} KB</div>
        <div class="file-expiry ${expiryClass}">⏳ ${days} hari lagi</div>
      </div>
    `;
  });
  fileGrid.innerHTML = html;

  // Delete events
  document.querySelectorAll('.file-item .delete').forEach(btn => {
    btn.addEventListener('click', async function(e) {
      e.stopPropagation();
      const id = this.dataset.id;
      if (!confirm('Padam fail ini?')) return;
      
      const result = await callAPI({ action: 'delete', fileId: id, userId: USER_ID });
      if (result.success) {
        showToast('🗑️ Fail dipadam', 'success');
        loadData();
      } else {
        showToast('❌ Gagal padam: ' + (result.error || 'unknown'), 'error');
      }
    });
  });
}

// ============ UPLOAD ============
async function uploadFiles(files) {
  if (!files || files.length === 0) return;
  
  uploadOverlay.classList.add('active');
  let successCount = 0;
  
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    uploadText.textContent = `🌌 Menelan ${file.name}... (${i+1}/${files.length})`;
    
    try {
      // Baca sebagai base64
      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      
      const payload = {
        action: 'upload',
        userId: USER_ID,
        filename: file.name,
        mimeType: file.type || 'application/octet-stream',
        size: file.size,
        content: base64
      };
      
      const result = await callAPI(payload);
      if (result.success) {
        successCount++;
      } else {
        showToast(`❌ ${file.name}: ${result.error}`, 'error');
      }
      
      // Delay sikit untuk effect
      await new Promise(r => setTimeout(r, 300));
      
    } catch (e) {
      showToast(`❌ ${file.name}: ${e.message}`, 'error');
    }
  }
  
  uploadOverlay.classList.remove('active');
  
  if (successCount > 0) {
    showToast(`✅ ${successCount} fail ditelan!`, 'success');
  }
  loadData();
}

// ============ EVENTS ============
blackhole.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', function() {
  if (this.files.length) {
    uploadFiles(this.files);
    this.value = '';
  }
});

// Drag & Drop
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', async e => {
  e.preventDefault();
  if (e.dataTransfer.files.length) {
    await uploadFiles(e.dataTransfer.files);
  }
});

refreshBtn.addEventListener('click', loadData);

// ============ INIT ============
loadData();

console.log('🌌 Black Hole Storage V2');
console.log('👤 User ID:', USER_ID);
console.log('🔗 API:', API_URL);
</script>
</body>
</html>

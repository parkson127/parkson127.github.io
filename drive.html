<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌌 Black Hole Wormhole</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0a0a0a;
      font-family: Arial, sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 900px; width:100%; }
    .header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:20px; }
    .blackhole {
      width:180px; height:180px; border-radius:50%;
      background: radial-gradient(circle, #000 30%, #2a1a3a 70%, #9c27b0);
      box-shadow: 0 0 60px rgba(156,39,176,0.4);
      cursor: pointer;
      margin: 0 auto 20px;
      transition: transform 0.3s;
      animation: pulse 3s infinite;
      position:relative;
    }
    .blackhole:hover { transform: scale(1.05); }
    .blackhole:active { transform: scale(0.95); }
    @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.02);} }
    .accretion {
      position:absolute; top:50%; left:50%; width:120%; height:40%;
      transform:translate(-50%,-50%) rotateX(75deg);
      background: radial-gradient(ellipse, rgba(156,39,176,0.3) 0%, rgba(33,150,243,0.2) 40%, transparent 70%);
      border-radius:50%;
      animation: spin 8s linear infinite;
      pointer-events:none;
    }
    @keyframes spin { 0%{transform:translate(-50%,-50%) rotateX(75deg) rotate(0deg);} 100%{transform:translate(-50%,-50%) rotateX(75deg) rotate(360deg);} }
    .status-panel {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 20px;
      margin: 20px 0;
      backdrop-filter:blur(10px);
      border:1px solid rgba(156,39,176,0.2);
    }
    .progress { height:6px; background:#333; border-radius:10px; overflow:hidden; margin:10px 0; }
    .progress-fill { height:100%; background: linear-gradient(90deg,#9c27b0,#2196f3); transition: width 0.5s; }
    .status-row { display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-top:10px; }
    .recent-log {
      background: rgba(255,255,255,0.03);
      border-radius:10px; padding:10px; margin-top:15px;
      border-left:3px solid #9c27b0;
    }
    .recent-log h4 { font-size:13px; color:#888; margin-bottom:8px; }
    .recent-log-item { font-size:13px; color:#ccc; padding:3px 0; border-bottom:1px solid rgba(255,255,255,0.05); }
    .recent-log-item span { color:#666; margin-left:10px; font-size:11px; }
    .breadcrumb { font-size:14px; color:#aaa; margin-bottom:15px; }
    .breadcrumb span { cursor:pointer; color:#9c27b0; }
    .breadcrumb span:hover { text-decoration:underline; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:15px; }
    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px,1fr));
      gap: 12px;
    }
    .file-item {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      position: relative;
      border:1px solid rgba(255,255,255,0.05);
      transition:0.3s;
      cursor: pointer;
    }
    .file-item:hover { background:rgba(255,255,255,0.08); transform:translateY(-2px); }
    .file-item .delete { position:absolute; top:5px; right:8px; background:none; border:none; color:#f44336; cursor:pointer; font-size:14px; }
    .file-item .actions-row { display:flex; gap:6px; justify-content:center; margin-top:6px; flex-wrap:wrap; }
    .btn-small { background:#333; border:none; color:white; padding:2px 8px; border-radius:4px; cursor:pointer; font-size:11px; }
    .btn-small:hover { background:#555; }
    .btn-small.primary { background:#9c27b0; }
    .btn-small.primary:hover { background:#7b1fa2; }
    .file-icon { font-size:32px; }
    .file-name { font-size:12px; word-break:break-all; color:#ddd; margin-top:4px; }
    .file-size { font-size:10px; color:#888; }
    .file-expiry { font-size:10px; margin-top:4px; }
    .file-expiry.urgent { color:#f44336; }
    .file-expiry.warning { color:#ff9800; }
    .file-expiry.safe { color:#4caf50; }
    .folder-item { border-color: rgba(33,150,243,0.3); }
    .folder-item .file-icon { color:#2196f3; }
    .toast {
      position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(100px);
      background:rgba(20,20,40,0.95); padding:12px 24px; border-radius:12px;
      border:1px solid #9c27b0; opacity:0; transition:0.5s; z-index:1000;
      backdrop-filter:blur(10px); max-width:90%; text-align:center;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    .toast.success { border-color:#4caf50; }
    .toast.error { border-color:#f44336; }
    .btn {
      padding:8px 20px; border:none; border-radius:8px;
      background:#9c27b0; color:#fff; cursor:pointer; font-weight:600;
      transition:0.3s;
    }
    .btn:hover { transform:translateY(-2px); box-shadow:0 4px 20px rgba(156,39,176,0.4); }
    .btn-secondary { background:rgba(255,255,255,0.1); }
    input[type=file] { display:none; }
    .modal {
      display:none; position:fixed; top:0; left:0; width:100%; height:100%;
      background:rgba(0,0,0,0.7); backdrop-filter:blur(5px); z-index:2000;
      justify-content:center; align-items:center;
    }
    .modal.active { display:flex; }
    .modal-content {
      background:#1a1a2e; border-radius:20px; padding:30px; max-width:400px; width:90%;
      border:1px solid rgba(156,39,176,0.3);
    }
    .modal-title { font-size:20px; margin-bottom:20px; }
    .modal input { width:100%; padding:12px; border-radius:10px; border:1px solid rgba(255,255,255,0.1); background:rgba(0,0,0,0.3); color:#fff; font-size:14px; }
    .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:15px; }
    .upload-overlay {
      display:none; position:fixed; top:0; left:0; width:100%; height:100%;
      background:rgba(0,0,0,0.7); backdrop-filter:blur(5px); z-index:1500;
      justify-content:center; align-items:center; flex-direction:column; gap:15px;
    }
    .upload-overlay.active { display:flex; }
    .upload-spinner { width:50px; height:50px; border:4px solid rgba(156,39,176,0.2); border-top:4px solid #9c27b0; border-radius:50%; animation:spin 1s linear infinite; }
    @keyframes spin { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
    .upload-text { color:#fff; font-size:16px; }
    .spaghettify {
      animation: spaghettify 1.5s ease-in forwards;
    }
    @keyframes spaghettify {
      0% { transform: scale(1) rotate(0deg); opacity:1; }
      100% { transform: scale(0.1) rotate(720deg) translateY(-80px); opacity:0; }
    }
    .empty-state { grid-column:1/-1; text-align:center; color:#666; padding:40px; }
    .empty-state .icon { font-size:60px; }
    @media (max-width:600px) {
      .blackhole { width:140px; height:140px; }
      .file-grid { grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); }
    }
  </style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <h1 style="font-size:24px;">🌌 Black Hole <span style="font-size:14px;color:#888;">Wormhole</span></h1>
    <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
      <span style="font-size:12px; color:#888; background:rgba(255,255,255,0.05); padding:4px 12px; border-radius:12px;" id="userIdDisplay">👤 user</span>
      <button class="btn btn-secondary" id="refreshBtn">🔄</button>
    </div>
  </div>

  <!-- Black Hole -->
  <div class="blackhole" id="blackhole" title="Klik untuk upload">
    <div class="accretion"></div>
  </div>
  <input type="file" id="fileInput" multiple>

  <!-- Status Panel -->
  <div class="status-panel">
    <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:5px;">
      <span>📦 Storan Digunakan</span>
      <span id="storageText">0 GB / 10 GB</span>
    </div>
    <div class="progress"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="status-row">
      <span id="statusText">✅ Available</span>
      <span id="fileCount">0 item</span>
      <span id="expiryInfo" style="font-size:12px; color:#888;">⏳ 15 hari auto-delete</span>
    </div>
    <!-- Recent Uploads Log -->
    <div class="recent-log" id="recentLog">
      <h4>🌀 Log Teleportasi (5 Terbaru)</h4>
      <div id="recentItems"><span style="color:#666; font-size:13px;">Tiada rekod</span></div>
    </div>
  </div>

  <!-- Breadcrumb & Actions -->
  <div class="breadcrumb" id="breadcrumb"><span onclick="navigateTo('/')">🏠 Root</span></div>
  <div class="actions">
    <button class="btn btn-secondary" onclick="openFolderModal()">📁 Folder Baru</button>
    <button class="btn" onclick="document.getElementById('fileInput').click()">📤 Upload</button>
  </div>

  <!-- File Grid -->
  <div class="file-grid" id="fileGrid"></div>
</div>

<!-- Modal Create Folder -->
<div class="modal" id="folderModal">
  <div class="modal-content">
    <h3 class="modal-title">📁 Cipta Folder Baru</h3>
    <input type="text" id="folderNameInput" placeholder="Nama folder..." />
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('folderModal')">Batal</button>
      <button class="btn" onclick="confirmCreateFolder()">Cipta</button>
    </div>
  </div>
</div>

<!-- Upload Overlay -->
<div class="upload-overlay" id="uploadOverlay">
  <div class="upload-spinner"></div>
  <div class="upload-text" id="uploadText">🌌 Menelan fail...</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ============ KONFIGURASI ============
const API_URL = "https://script.google.com/macros/s/AKfycbwF0BFIgC5R46vwszduddSWoej_SfeSeXmIGc8vtULv1QRweR53py7cYwjg0MncjOUN/exec"; // Ganti dengan URL Google Apps Script
const USER_ID = "user"; // ID tetap

// ============ STATE ============
let currentPath = '/';
let allItems = [];
let recentUploads = JSON.parse(localStorage.getItem('recentUploads') || '[]');

// ============ ELEMEN ============
const blackhole = document.getElementById('blackhole');
const fileInput = document.getElementById('fileInput');
const fileGrid = document.getElementById('fileGrid');
const progressFill = document.getElementById('progressFill');
const storageText = document.getElementById('storageText');
const statusText = document.getElementById('statusText');
const fileCount = document.getElementById('fileCount');
const toast = document.getElementById('toast');
const refreshBtn = document.getElementById('refreshBtn');
const userIdDisplay = document.getElementById('userIdDisplay');
const uploadOverlay = document.getElementById('uploadOverlay');
const uploadText = document.getElementById('uploadText');
const breadcrumb = document.getElementById('breadcrumb');
const recentItems = document.getElementById('recentItems');

userIdDisplay.textContent = '👤 ' + USER_ID;

// ============ TOAST ============
function showToast(msg, type='info') {
  toast.textContent = msg;
  toast.className = 'toast show ' + type;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toast.classList.remove('show'), 4000);
}

// ============ API ============
function callAPI(data) {
  return new Promise((resolve, reject) => {
    const callbackName = 'jsonp_callback_' + Date.now() + '_' + Math.random().toString(36).substr(2,4);
    const params = new URLSearchParams();
    params.append('callback', callbackName);
    params.append('action', data.action);
    if (data.userId) params.append('userId', data.userId);
    if (data.fileId) params.append('fileId', data.fileId);
    if (data.folderPath) params.append('folderPath', data.folderPath);
    if (data.folderName) params.append('folderName', data.folderName);
    window[callbackName] = function(response) {
      delete window[callbackName];
      document.body.removeChild(script);
      resolve(response);
    };
    const script = document.createElement('script');
    script.src = API_URL + '?' + params.toString();
    script.onerror = function() {
      delete window[callbackName];
      document.body.removeChild(script);
      reject(new Error('JSONP request failed'));
    };
    document.body.appendChild(script);
  });
}

async function callAPIPost(data) {
  try {
    const formData = new FormData();
    formData.append('payload', JSON.stringify(data));
    const response = await fetch(API_URL, { method: 'POST', body: formData });
    const text = await response.text();
    try { return JSON.parse(text); } catch(e) { return { success: true, raw: text }; }
  } catch(e) { throw e; }
}

// ============ NAVIGATION ============
function navigateTo(path) {
  currentPath = path;
  loadData();
}

function updateBreadcrumb() {
  const parts = currentPath.split('/').filter(p => p);
  let html = `<span onclick="navigateTo('/')">🏠 Root</span>`;
  let path = '';
  parts.forEach((part, i) => {
    path += '/' + part;
    if (i === parts.length-1) html += ` / <span style="color:#9c27b0;">${part}</span>`;
    else html += ` / <span onclick="navigateTo('${path}')">${part}</span>`;
  });
  breadcrumb.innerHTML = html;
}

// ============ LOAD DATA ============
async function loadData() {
  try {
    // Status
    const status = await callAPI({ action: 'getStatus', userId: USER_ID });
    if (status.success) {
      const used = status.used || 0; const max = status.max || 10*1024*1024*1024;
      const percent = (used/max)*100;
      storageText.textContent = `${(used/1e9).toFixed(2)} GB / ${(max/1e9).toFixed(0)} GB`;
      progressFill.style.width = Math.min(percent,100)+'%';
      if (status.isFull) { statusText.textContent='🚫 Full'; statusText.style.color='#f44336'; }
      else if (percent>80) { statusText.textContent='⚠️ Almost Full'; statusText.style.color='#ff9800'; }
      else { statusText.textContent='✅ Available'; statusText.style.color='#4caf50'; }
    }
    // List items
    const result = await callAPI({ action: 'list', userId: USER_ID, folderPath: currentPath });
    if (result.success) {
      allItems = result.items || [];
      fileCount.textContent = allItems.length + ' item';
      renderItems(allItems);
      updateBreadcrumb();
      updateRecentLog();
    }
  } catch(e) {
    console.error('Load error:', e);
    showToast('❌ Ralat memuat data: ' + e.message, 'error');
  }
}

// ============ RENDER ITEMS ============
function renderItems(items) {
  if (!items || items.length === 0) {
    fileGrid.innerHTML = `<div class="empty-state"><div class="icon">🌌</div><h3 style="color:#888; margin-bottom:8px;">Kosong</h3><p style="color:#666; font-size:14px;">Seret fail atau klik lubang hitam</p></div>`;
    return;
  }
  let html = '';
  items.forEach(item => {
    if (item.type === 'folder') {
      html += `
        <div class="file-item folder-item" onclick="navigateTo('${currentPath === '/' ? '' : currentPath}/${item.name}')">
          <div class="file-icon">📁</div>
          <div class="file-name">${item.name}</div>
          <div style="font-size:10px; color:#888;">Folder</div>
          <button class="delete" onclick="event.stopPropagation(); deleteFolder('${item.name}')">✕</button>
        </div>
      `;
    } else {
      const days = item.daysLeft !== undefined ? item.daysLeft : '?';
      let expiryClass = 'safe';
      if (days <= 3) expiryClass = 'urgent';
      else if (days <= 7) expiryClass = 'warning';
      const icon = getFileIcon(item.name);
      html += `
        <div class="file-item" onclick="previewFile('${item.url}')">
          <button class="delete" onclick="event.stopPropagation(); deleteFile('${item.id}')">✕</button>
          <div class="file-icon">${icon}</div>
          <div class="file-name">${item.name}</div>
          <div class="file-size">${(item.size/1024).toFixed(1)} KB</div>
          <div class="file-expiry ${expiryClass}">⏳ ${days} hari</div>
          <div class="actions-row">
            <button class="btn-small primary" onclick="event.stopPropagation(); downloadFile('${item.id}','${item.name}')">📥</button>
            <button class="btn-small" onclick="event.stopPropagation(); copyLink('${item.url}')">🔗</button>
          </div>
        </div>
      `;
    }
  });
  fileGrid.innerHTML = html;
}

function getFileIcon(name) {
  const ext = name.split('.').pop().toLowerCase();
  const icons = { jpg:'🖼️',jpeg:'🖼️',png:'🖼️',gif:'🖼️',webp:'🖼️',svg:'🖼️', pdf:'📄',doc:'📝',docx:'📝',xls:'📊',xlsx:'📊', mp3:'🎵',wav:'🎵',mp4:'🎬',avi:'🎬',mov:'🎬', zip:'📦',rar:'📦',7z:'📦',txt:'📃' };
  return icons[ext] || '📎';
}

// ============ RECENT LOG ============
function updateRecentLog() {
  // Get last 5 uploaded files (from allItems, sorted by date)
  const files = allItems.filter(i => i.type === 'file').sort((a,b) => new Date(b.date) - new Date(a.date));
  const recent = files.slice(0,5);
  if (recent.length === 0) {
    recentItems.innerHTML = '<span style="color:#666; font-size:13px;">Tiada rekod</span>';
    return;
  }
  let html = '';
  recent.forEach(f => {
    const d = new Date(f.date);
    const time = d.toLocaleTimeString();
    html += `<div class="recent-log-item">📄 ${f.name} <span>${time}</span></div>`;
  });
  recentItems.innerHTML = html;
}

// ============ UPLOAD ============
async function uploadFiles(files) {
  if (!files || files.length === 0) return;
  uploadOverlay.classList.add('active');
  let successCount = 0;
  for (let i=0; i<files.length; i++) {
    const file = files[i];
    uploadText.textContent = `🌌 Menelan ${file.name}... (${i+1}/${files.length})`;
    try {
      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      const payload = {
        action: 'upload',
        userId: USER_ID,
        filename: file.name,
        mimeType: file.type || 'application/octet-stream',
        size: file.size,
        content: base64,
        folderPath: currentPath === '/' ? '' : currentPath
      };
      const result = await callAPIPost(payload);
      if (result.success) {
        successCount++;
        // Add to recent log (localStorage)
        const recent = JSON.parse(localStorage.getItem('recentUploads') || '[]');
        recent.unshift({ name: file.name, date: new Date().toISOString() });
        if (recent.length > 50) recent.pop();
        localStorage.setItem('recentUploads', JSON.stringify(recent));
        showToast(`✅ ${file.name} ditelan!`, 'success');
        // Spaghettify animation on a floating element (optional)
        // We'll just show toast
      } else {
        showToast(`❌ ${file.name}: ${result.error}`, 'error');
      }
      await new Promise(r => setTimeout(r, 300));
    } catch(e) { showToast(`❌ ${file.name}: ${e.message}`, 'error'); }
  }
  uploadOverlay.classList.remove('active');
  if (successCount > 0) showToast(`✅ ${successCount} fail ditelan!`, 'success');
  loadData();
}

// ============ DOWNLOAD ============
async function downloadFile(fileId, fileName) {
  try {
    showToast(`📥 Memuat turun ${fileName}...`, 'info');
    const result = await callAPIPost({ action: 'download', fileId: fileId, userId: USER_ID });
    if (result.success) {
      const byteCharacters = atob(result.content);
      const byteNumbers = new Array(byteCharacters.length);
      for (let i=0; i<byteCharacters.length; i++) byteNumbers[i] = byteCharacters.charCodeAt(i);
      const byteArray = new Uint8Array(byteNumbers);
      const blob = new Blob([byteArray], { type: result.mimeType || 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = result.name || fileName;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast(`✅ ${fileName} dimuat turun!`, 'success');
    } else {
      showToast(`❌ Gagal: ${result.error}`, 'error');
    }
  } catch(e) { showToast(`❌ Ralat: ${e.message}`, 'error'); }
}

// ============ PREVIEW (open in new tab) ============
function previewFile(url) {
  window.open(url, '_blank');
}

// ============ COPY LINK ============
function copyLink(url) {
  navigator.clipboard.writeText(url).then(() => {
    showToast('✅ Pautan disalin!', 'success');
  }).catch(() => {
    // Fallback
    const input = document.createElement('input');
    input.value = url;
    document.body.appendChild(input);
    input.select();
    document.execCommand('copy');
    document.body.removeChild(input);
    showToast('✅ Pautan disalin!', 'success');
  });
}

// ============ DELETE FILE ============
async function deleteFile(fileId) {
  if (!confirm('Padam fail ini?')) return;
  try {
    const result = await callAPI({ action: 'delete', fileId: fileId, userId: USER_ID });
    if (result.success) { showToast('🗑️ Fail dipadam', 'success'); loadData(); }
    else showToast('❌ Gagal padam', 'error');
  } catch(e) { showToast('❌ Ralat: '+e.message, 'error'); }
}

// ============ DELETE FOLDER ============
async function deleteFolder(folderName) {
  if (!confirm(`Padam folder "${folderName}" dan semua kandungannya?`)) return;
  try {
    const path = currentPath === '/' ? folderName : currentPath + '/' + folderName;
    const result = await callAPI({ action: 'deleteFolder', userId: USER_ID, folderPath: path });
    if (result.success) { showToast('🗑️ Folder dipadam', 'success'); loadData(); }
    else showToast('❌ Gagal padam folder', 'error');
  } catch(e) { showToast('❌ Ralat: '+e.message, 'error'); }
}

// ============ CREATE FOLDER ============
function openFolderModal() {
  document.getElementById('folderNameInput').value = '';
  openModal('folderModal');
}

async function confirmCreateFolder() {
  const name = document.getElementById('folderNameInput').value.trim();
  if (!name) { showToast('❌ Sila masukkan nama folder', 'error'); return; }
  // Check if already exists in current items
  if (allItems.some(i => i.type === 'folder' && i.name === name)) {
    showToast('❌ Folder sudah wujud', 'error');
    return;
  }
  try {
    const result = await callAPI({
      action: 'createSubFolder',
      userId: USER_ID,
      folderName: name,
      folderPath: currentPath === '/' ? '' : currentPath
    });
    if (result.success) {
      showToast(`📁 Folder "${name}" dicipta!`, 'success');
      closeModal('folderModal');
      loadData();
    } else {
      showToast(`❌ Gagal: ${result.error}`, 'error');
    }
  } catch(e) { showToast(`❌ Ralat: ${e.message}`, 'error'); }
}

// ============ MODAL ============
function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }
// Click outside to close
document.querySelectorAll('.modal').forEach(m => {
  m.addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('active');
  });
});

// ============ EVENTS ============
blackhole.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', function() {
  if (this.files.length) { uploadFiles(this.files); this.value = ''; }
});
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', async e => {
  e.preventDefault();
  if (e.dataTransfer.files.length) await uploadFiles(e.dataTransfer.files);
});
refreshBtn.addEventListener('click', loadData);

// ============ INIT ============
loadData();
// Auto-refresh every 15 seconds
setInterval(loadData, 15000);
console.log('🌌 Black Hole Wormhole loaded!');
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Test Black Hole</title>
</head>
<body>
    <h1>🌌 Test Black Hole</h1>
    <button onclick="testAPI()">Test API</button>
    <div id="result"></div>

    <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbws7y0gW2UJYEB55W6Od_hoTAYfitxyBw-4BPvgrUFfIEWPw7tlOIIIh25kItai4oY_/exec"; // Ganti dengan URL Google Apps Script anda

    function testAPI() {
        const callbackName = 'jsonp_test_' + Date.now();
        
        window[callbackName] = function(data) {
            document.getElementById('result').innerHTML = 
                '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            delete window[callbackName];
        };

        const script = document.createElement('script');
        script.src = API_URL + '?callback=' + callbackName + '&action=getStatus';
        script.onerror = function() {
            document.getElementById('result').innerHTML = 
                '❌ Error: Script failed to load. Check your API URL.';
        };
        document.body.appendChild(script);
    }
    </script>
</body>
</html>
